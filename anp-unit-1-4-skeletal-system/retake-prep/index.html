/* ---------- Word Lab ---------- */
var wl;
function wordPool(n){var w=shuf(GLOSS.filter(function(g){return isWeak(g.sk)&&!S.known[g.t]})),u=shuf(GLOSS.filter(function(g){return !S.known[g.t]&&!isWeak(g.sk)})),k=shuf(GLOSS.filter(function(g){return S.known[g.t]}));
  return w.concat(u).concat(k).slice(0,n)}
function startWords(){wl={cards:wordPool(8),i:0,flip:false,phase:'cards'};renderWords()}
function renderWords(){window.scrollTo(0,0);var c=wl.cards[wl.i],h='<h2>Word Lab</h2>';
  if(wl.phase==='cards'){h+='<p class="note">Step 1 of 2: flashcards. Say what the word means out loud, then flip the card. Card '+(wl.i+1)+' of '+wl.cards.length+'.</p>';
    h+='<button class="flash'+(wl.flip?' back':'')+'" onclick="wl.flip=!wl.flip;renderWords()">'+(wl.flip?'<span class="fd">'+esc(c.d)+'</span>'+(c.p?'<span class="fp">Word parts: '+esc(c.p)+'</span>':''):'<span class="ft">'+esc(c.t)+'</span><span class="fh">'+esc(SK[c.sk].lt+' · '+SK[c.sk].name)+'</span><span class="fh">Tap to flip</span>')+'</button>';
    if(wl.flip)h+='<div><button class="go" onclick="wordRate(true)">I knew it</button><button class="go alt" onclick="wordRate(false)">Not yet</button></div>';
    app.innerHTML=h+back();return}
  var q=wl.qs[wl.i];h+='<p class="note">Step 2 of 2: quiz yourself. Question '+(wl.i+1)+' of '+wl.qs.length+'.</p><div class="panel"><h3>'+esc(q.prompt)+'</h3><div id="wo">';
  q.opts.forEach(function(o,j){h+='<button class="opt" data-j="'+j+'">'+esc(o)+'</button>'});h+='</div><div id="wf"></div></div>';app.innerHTML=h+back();
  document.querySelectorAll('#wo .opt').forEach(function(b){b.onclick=function(){wordAns(+b.getAttribute('data-j'),b)}})}
function wordRate(ok){var c=wl.cards[wl.i];if(ok){S.known[c.t]=1;delete S.miss[c.t]}else{S.miss[c.t]=1;delete S.known[c.t]}save();
  wl.i++;wl.flip=false;if(wl.i>=wl.cards.length){wl.phase='quiz';wl.i=0;wl.qs=wl.cards.map(function(c,j){return wordQ(c,j%2===0)});wl.right=0}renderWords()}
function wordQ(c,defToTerm){var others=shuf(GLOSS.filter(function(g){return g.t!==c.t&&(g.sk===c.sk||Math.random()<.3)})).slice(0,3);
  if(others.length<3)others=others.concat(shuf(GLOSS.filter(function(g){return g.t!==c.t&&others.indexOf(g)<0})).slice(0,3-others.length));
  if(defToTerm)return {c:c,prompt:'Which word means: "'+c.d+'"',opts:shuf([c.t].concat(others.map(function(g){return g.t}))),ans:c.t};
  return {c:c,prompt:'What does "'+c.t+'" mean?',opts:shuf([c.d].concat(others.map(function(g){return g.d}))),ans:c.d}}
function wordAns(j,btn){var q=wl.qs[wl.i];if(q.done)return;q.done=true;var ok=q.opts[j]===q.ans;tally(q.c.sk,ok,'words');S.w.words++;
  if(ok){wl.right++;S.known[q.c.t]=1;delete S.miss[q.c.t]}else{S.miss[q.c.t]=1;delete S.known[q.c.t]}save();
  document.querySelectorAll('#wo .opt').forEach(function(b){var o=q.opts[+b.getAttribute('data-j')];if(o===q.ans)b.classList.add('ok');else if(b===btn)b.classList.add('bad')});
  document.getElementById('wf').innerHTML='<p class="fb '+(ok?'ok':'bad')+'">'+(ok?'Correct. ':'Not quite. ')+'<b>'+esc(q.c.t)+'</b>: '+esc(q.c.d)+(q.c.p?' <i>('+esc(q.c.p)+')</i>':'')+'</p>'+(ok?'':fixNote(q.c.sk))+'<button class="go" onclick="wordNext()">'+(wl.i+1<wl.qs.length?'Next':'Finish')+'</button>'}
function wordNext(){wl.i++;if(wl.i<wl.qs.length){renderWords();return}
  app.innerHTML='<h2>Word Lab done</h2><div class="sum"><p><b>'+wl.right+' of '+wl.qs.length+'</b> correct. You know <b>'+Object.keys(S.known).length+' of '+GLOSS.length+'</b> words.</p><p>Tip: words you missed come back first next time.</p></div><button class="go" onclick="startWords()">Another set of 8 words</button><button class="go alt" onclick="showGlossary()">See all the words</button>'+back()}
function showGlossary(){var h='<h2>All the words</h2><p class="note">Green = you know it. Orange = keep practicing.</p>';
  LTS.forEach(function(l){h+='<h3>'+l.id+': '+esc(l.name)+'</h3><table class="plan">';GLOSS.filter(function(g){return SK[g.sk].lt===l.id}).forEach(function(g){var st=S.known[g.t]?' class="kn"':S.miss[g.t]?' class="ms"':'';h+='<tr'+st+'><td><b>'+esc(g.t)+'</b>'+(g.p?'<br><small>'+esc(g.p)+'</small>':'')+'</td><td>'+esc(g.d)+'</td></tr>'});h+='</table>'});
  app.innerHTML=h+back();window.scrollTo(0,0)}

/* ---------- Write It Out ---------- */
var wi;
function startWrite(){wi={qs:choose(SA,4),i:0};renderWrite()}
function renderWrite(){window.scrollTo(0,0);var q=wi.qs[wi.i];var prev=S.w.sa[q.q];
  app.innerHTML='<h2>Write It Out</h2><p class="note">Question '+(wi.i+1)+' of '+wi.qs.length+' · '+esc(SK[q.sk].lt+' · '+SK[q.sk].name)+'</p><div class="panel"><h3>'+esc(q.q)+'</h3>'+fixNote(q.sk)+'<textarea id="saT" placeholder="Type your answer. Use the unit words.">'+(prev?esc(prev.a):'')+'</textarea><button class="go" id="saB">Check my answer</button><div id="saF"></div></div>'+back();
  document.getElementById('saB').onclick=writeCheck}
function writeCheck(){var q=wi.qs[wi.i],t=document.getElementById('saT').value.trim();if(t.length<10){document.getElementById('saF').innerHTML='<p class="fb part">Write at least one full sentence first.</p>';return}
  var h='<div class="ans"><b>A strong answer includes:</b>';q.a.forEach(function(a,j){h+='<label class="chk"><input type="checkbox" data-j="'+j+'"> '+esc(a)+'</label>'});
  h+='</div><p>Check each point that your answer includes. Be honest; this is for you.</p><button class="go" id="saD">Done checking</button>';var f=document.getElementById('saF');f.innerHTML=h;document.getElementById('saB').disabled=true;
  document.getElementById('saD').onclick=function(){var n=document.querySelectorAll('#saF input:checked').length,ok=n>=q.a.length-0;var part=n>=Math.ceil(q.a.length/2);
    tally(q.sk,ok,'write');S.w.sa[q.q]={a:t,ok:ok};save();
    f.innerHTML='<p class="fb '+(ok?'ok':part?'part':'bad')+'">'+(ok?'You hit every point. That counts as correct.':'You hit '+n+' of '+q.a.length+' points. Add the missing ones to your notes. This counts as "not yet."')+'</p><button class="go" onclick="writeNext()">'+(wi.i+1<wi.qs.length?'Next question':'Finish')+'</button>'}}
function writeNext(){wi.i++;if(wi.i<wi.qs.length)renderWrite();else{app.innerHTML='<h2>Write It Out done</h2><div class="sum"><p>Your answers are saved and go into <b>Copy my work</b>.</p></div><button class="go" onclick="startWrite()">Four more questions</button>'+back()}}

/* ---------- Match-Up ---------- */
var mu;
function startMatch(){var pool=wordPool(15),rs=[];for(var i=0;i+3<=pool.length&&rs.length<3;i+=5)rs.push(pool.slice(i,i+5));mu={rounds:rs,r:0,sel:null,miss:0,ok:0};renderMatch()}
function renderMatch(){window.scrollTo(0,0);var R=mu.rounds[mu.r];mu.left=shuf(R);mu.right=shuf(R);mu.got=0;
  var h='<h2>Match-Up</h2><p class="note">Round '+(mu.r+1)+' of '+mu.rounds.length+'. Tap a word, then tap what it means.</p><div class="match"><div>';
  mu.left.forEach(function(g,i){h+='<button class="m" id="L'+i+'" onclick="mPick(\'L\','+i+')"><b>'+esc(g.t)+'</b></button>'});h+='</div><div>';
  mu.right.forEach(function(g,i){h+='<button class="m" id="R'+i+'" onclick="mPick(\'R\','+i+')">'+esc(g.d)+'</button>'});
  app.innerHTML=h+'</div></div><div id="mF"></div>'+back()}
function mPick(side,i){var b=document.getElementById(side+i);if(b.classList.contains('gone'))return;
  if(!mu.sel||mu.sel[0]===side){document.querySelectorAll('.m.sel').forEach(function(x){x.classList.remove('sel')});mu.sel=[side,i];b.classList.add('sel');return}
  var L=side==='L'?i:mu.sel[1],Rr=side==='R'?i:mu.sel[1],g=mu.left[L],ok=g.t===mu.right[Rr].t;
  var bl=document.getElementById('L'+L),br=document.getElementById('R'+Rr);mu.sel=null;document.querySelectorAll('.m.sel').forEach(function(x){x.classList.remove('sel')});
  tally(g.sk,ok,'match');S.w.match++;
  if(ok){bl.classList.add('gone');br.classList.add('gone');mu.ok++;mu.got++;S.known[g.t]=1;delete S.miss[g.t];save();document.getElementById('mF').innerHTML='';
    if(mu.got===mu.rounds[mu.r].length){mu.r++;document.getElementById('mF').innerHTML=mu.r<mu.rounds.length?'<p class="fb ok">Round cleared!</p><button class="go" onclick="renderMatch()">Next round</button>':'<div class="sum"><p><b>Board cleared!</b> '+mu.ok+' matches, '+mu.miss+' misses.</p></div><button class="go" onclick="startMatch()">Play again</button>'}}
  else{mu.miss++;S.miss[g.t]=1;save();bl.classList.add('wrong');br.classList.add('wrong');setTimeout(function(){bl.classList.remove('wrong');br.classList.remove('wrong')},700);
    document.getElementById('mF').innerHTML='<p class="fb bad"><b>'+esc(g.t)+'</b> means: '+esc(g.d)+'</p>'}}

/* ---------- Prove It Case ---------- */
var cs;
function startCase(){var order=CASES.map(function(_,i){return i}).sort(function(a,b){return (isWeak(CASES[b].sk)?1:0)-(isWeak(CASES[a].sk)?1:0)||Math.random()-.5});
  cs={order:order,k:0};caseOpen()}
function caseOpen(){cs.c=CASES[cs.order[cs.k]];cs.step=0;cs.firstTry=true;renderCase()}
function caseEv(){return '<div class="ev">'+cs.c.ev.map(function(e){return '<p><b>Evidence '+e[0]+'.</b> '+esc(e[1])+'</p>'}).join('')+'</div>'}
function renderCase(){window.scrollTo(0,0);var c=cs.c,h='<h2>Prove It: '+esc(c.title)+'</h2><p class="note">Case '+(cs.k+1)+' of '+CASES.length+' · Step '+(cs.step+1)+' of 3</p>'+caseEv()+'<div class="panel">';
  if(cs.step===0||cs.step===2){var part=cs.step===0?c.claim:c.reason;h+='<h3>'+(cs.step===0?'Claim: ':'Reasoning: ')+esc(part.q)+'</h3><div id="co">';
    shuf(part.opts.map(function(_,i){return i})).forEach(function(i){h+='<button class="opt" data-i="'+i+'">'+esc(part.opts[i][0])+'</button>'});h+='</div><div id="cf"></div>'}
  else{h+='<h3>Evidence: '+esc(c.evQ)+'</h3><div id="ce">';c.ev.forEach(function(e){h+='<label class="chk"><input type="checkbox" value="'+e[0]+'"> Evidence '+e[0]+'</label>'});h+='</div><button class="go" onclick="caseEvCheck()">Check</button><div id="cf"></div>'}
  app.innerHTML=h+'</div>'+back();
  document.querySelectorAll('#co .opt').forEach(function(b){b.onclick=function(){caseOpt(+b.getAttribute('data-i'),b)}})}
function caseOpt(i,b){var part=cs.step===0?cs.c.claim:cs.c.reason,o=part.opts[i],ok=o[1]==='best';
  if(cs.firstTry){tally(cs.c.sk,ok,'cases');cs.firstTry=false}
  b.classList.add(ok?'ok':'bad');document.getElementById('cf').innerHTML='<p class="fb '+(ok?'ok':'bad')+'">'+esc(o[2])+'</p>'+(ok?'<button class="go" onclick="caseNext()">Next step</button>':'<p class="note">Try another answer.</p>')}
function caseEvCheck(){var want=cs.c.evOk,got=[];document.querySelectorAll('#ce input:checked').forEach(function(x){got.push(x.value)});
  var ok=want.length===got.length&&want.every(function(w){return got.indexOf(w)>=0});
  if(cs.firstTry){tally(cs.c.sk,ok,'cases');cs.firstTry=false}
  document.getElementById('cf').innerHTML=ok?'<p class="fb ok">Yes: Evidence '+want.join(', ')+'.</p><button class="go" onclick="caseNext()">Next step</button>':'<p class="fb bad">Not quite. Reread each piece. Does it point to this claim, or is it just background?</p>'+(cs.tries=(cs.tries||0)+1,cs.tries>=2?'<p class="fb part">The supporting evidence is '+want.join(', ')+'.</p><button class="go" onclick="caseNext()">Next step</button>':'')}
function caseNext(){cs.step++;cs.firstTry=true;cs.tries=0;if(cs.step<3){renderCase();return}S.w.cases++;save();
  cs.k++;app.innerHTML='<h2>Case closed</h2><div class="sum"><p>You built a full claim, evidence, and reasoning answer. On the test, write it in that same order.</p></div>'+(cs.k<CASES.length?'<button class="go" onclick="caseOpen()">Next case</button>':'<p>You finished every case!</p>')+back()}

/* ---------- Model Builder ---------- */
var mb;
function startModel(r){mb={r:r||0,step:'cards',box:0,picked:[],firstTry:true,ai:0,bi:0};renderModel()}
function modelStrip(){var M=MODELS[mb.r],h='<div class="chainrow">';MBOX.forEach(function(b,i){var c=mb.picked[i];h+='<div class="cbox'+(c?' done':'')+'"><b>Box '+(i+1)+': '+esc(b)+'</b>'+(c?esc(c):'')+'</div>'+(i<3?'<span class="carrow">→</span>':'')});return h+'</div>'}
function renderModel(){window.scrollTo(0,0);var M=MODELS[mb.r],h='<h2>Model Builder: '+esc(M.title)+'</h2><p class="note">Model '+(mb.r+1)+' of '+MODELS.length+'. '+esc(M.move)+'</p>'+modelStrip()+'<div class="panel">';
  if(mb.step==='cards'){h+='<h3>Which card belongs in Box '+(mb.box+1)+': '+esc(MBOX[mb.box])+'?</h3><p class="note">Some cards do not belong anywhere.</p><div id="mo">';
    M.cards.forEach(function(c,i){if(mb.picked.indexOf(c[0])<0)h+='<button class="opt" data-i="'+i+'">'+esc(c[0])+'</button>'});h+='</div><div id="mf"></div>'}
  else if(mb.step==='arrows'){var A=M.arrows[mb.ai];h+='<h3>'+esc(A.q)+'</h3><div id="mo">';mb.ao=shuf([0,1,2]);mb.ao.forEach(function(i){h+='<button class="opt" data-i="'+i+'">'+esc(A.o[i])+'</button>'});h+='</div><div id="mf"></div>'}
  else if(mb.step==='final'){var F=M.final;h+='<h3>'+esc(F.q)+'</h3><div id="mo">';shuf([0,1,2,3]).forEach(function(i){h+='<button class="opt" data-i="'+i+'">'+esc(F.o[i][0])+'</button>'});h+='</div><div id="mf"></div>'}
  else if(mb.step==='write'){var prev=S.w.model[M.title]||'';h+='<h3>Now write your model</h3><p>Write it the way the test asks: one line for each box, then explain each arrow. Use these starters:</p><div class="ev"><p>Box 1 (junction): ___. Arrow 1: ___ connects it to Box 2 because ___.</p><p>Box 2 (inside the fiber): ___. Arrow 2: ___.</p><p>Box 3 (sarcomeres): ___. Arrow 3: ___.</p><p>Box 4 (whole muscle and bone): ___.</p></div><textarea id="mwT" style="min-height:160px">'+esc(prev)+'</textarea><button class="go" onclick="modelSave()">Save my model</button><div id="mf"></div>'}
  app.innerHTML=h+'</div>'+back();
  document.querySelectorAll('#mo .opt').forEach(function(b){b.onclick=function(){modelPick(+b.getAttribute('data-i'),b)}})}
function modelPick(i,b){var M=MODELS[mb.r],f=document.getElementById('mf'),ok,msg;
  if(mb.step==='cards'){var c=M.cards[i];ok=c[1]===mb.box;
    msg=ok?'Yes, that is Box '+(mb.box+1)+'.':(c[1]<0?'That card does not belong in the model. Check the facts: is that how it really works?':'That card belongs in a different box. What happens at the '+MBOX[mb.box].toLowerCase()+'?');
    if(mb.firstTry){tally('model',ok,'model');mb.firstTry=false}
    b.classList.add(ok?'ok':'bad');
    if(ok){mb.picked[mb.box]=c[0];mb.box++;mb.firstTry=true;f.innerHTML='<p class="fb ok">'+msg+'</p><button class="go" onclick="modelAdv()">'+(mb.box<4?'Next box':'Explain the arrows')+'</button>';document.querySelectorAll('#mo .opt').forEach(function(x){x.disabled=true})}
    else f.innerHTML='<p class="fb bad">'+msg+'</p>';return}
  if(mb.step==='arrows'){var A=M.arrows[mb.ai];ok=i===0;if(mb.firstTry){tally(mb.ai===2?'sliding':'calcium',ok,'model');mb.firstTry=false}
    b.classList.add(ok?'ok':'bad');f.innerHTML='<p class="fb '+(ok?'ok':'bad')+'">'+(ok?'Yes. ':'Not quite. ')+esc(A.w)+'</p>'+(ok?'<button class="go" onclick="modelAdv()">Next</button>':'');return}
  if(mb.step==='final'){var F=M.final;ok=F.o[i][1]==='best';if(mb.firstTry){tally(mb.r===0?'aerobic':'mg',ok,'model');mb.firstTry=false}
    b.classList.add(ok?'ok':'bad');f.innerHTML='<p class="fb '+(ok?'ok':'bad')+'">'+(ok?'Yes. ':'Not quite. ')+esc(F.w)+'</p>'+(ok?'<button class="go" onclick="modelAdv()">Write your model</button>':'')}}
function modelAdv(){var M=MODELS[mb.r];mb.firstTry=true;
  if(mb.step==='cards'){if(mb.box>=4){mb.step='arrows';mb.ai=0}}
  else if(mb.step==='arrows'){mb.ai++;if(mb.ai>=M.arrows.length)mb.step='final'}
  else if(mb.step==='final')mb.step='write';
  renderModel()}
function modelSave(){var t=document.getElementById('mwT').value.trim();var M=MODELS[mb.r];if(t.length<40){document.getElementById('mf').innerHTML='<p class="fb part">Write a line for each box and explain each arrow first.</p>';return}
  S.w.model[M.title]=t;save();
  app.innerHTML='<h2>Model saved</h2><div class="sum"><p>Your model goes into <b>Copy my work</b>.</p></div><h3>Bonus: break the model</h3><p class="note">For each problem, which box breaks first?</p><div id="brk"></div>'+back();breakQ(0)}
function breakQ(k){var host=document.getElementById('brk');if(!host)return;if(k>=BREAK.length){host.insertAdjacentHTML('beforeend','<div class="sum"><p>Model done!</p></div>'+(mb.r+1<MODELS.length?'<button class="go" onclick="startModel('+(mb.r+1)+')">Build the next model</button>':'<button class="go" onclick="startModel(0)">Build model 1 again</button>'));return}
  var B=BREAK[k],d=document.createElement('div');d.className='panel';d.innerHTML='<h3>'+esc(B.q)+'</h3>'+MBOX.map(function(b,i){return '<button class="opt" data-i="'+i+'">Box '+(i+1)+': '+esc(b)+'</button>'}).join('')+'<div class="bf"></div>';host.appendChild(d);var tried=false;
  d.querySelectorAll('.opt').forEach(function(btn){btn.onclick=function(){var i=+btn.getAttribute('data-i'),ok=i===B.a;if(!tried){tally(['ach','sarcomere','calcium','muscles'][B.a],ok,'model');tried=true}
    btn.classList.add(ok?'ok':'bad');d.querySelector('.bf').innerHTML='<p class="fb '+(ok?'ok':'bad')+'">'+(ok?'Yes. ':'Not quite. ')+esc(B.w)+'</p>';if(ok){d.querySelectorAll('.opt').forEach(function(x){x.disabled=true});breakQ(k+1)}}})}

/* ---------- Muscle Quest (game) ---------- */
var gm=null,gT=null;
function gmStop(){if(gT){clearInterval(gT);gT=null}}
function startGame(){gm={hearts:3,score:0,combo:1,best:1,i:0,rush:wordPool(10).map(function(c,j){return wordQ(c,j%2===0)}),boss:null};gameIntro()}
function hud(){var h='';for(var i=0;i<3;i++)h+='<span class="'+(i<gm.hearts?'':'lost')+'">♥</span>';return '<div class="hud"><span class="hearts">'+h+'</span><span class="lvl">'+(gm.boss?'BOSS':'WORD RUSH '+(gm.i+1)+'/'+gm.rush.length)+'</span><span class="combo">x'+gm.combo+'</span><span>'+gm.score+' pts</span></div>'}
function gshell(inner){app.innerHTML='<div class="game" id="game"><div class="stars"></div>'+hud()+inner+'</div>'+back()}
function gameIntro(){gshell('<div class="gtitle">'+esc(CFG.gameName.toUpperCase())+'</div><p class="gsub">Level 1: Word Rush. Answer before the timer runs out. Fast answers build your combo.<br>Level 2: the Boss. Knock it out with what you know.</p><div class="center"><button class="gbtn" onclick="rushQ()">START</button></div>')}
function rushQ(){gmStop();if(gm.hearts<=0)return gameOver();if(gm.i>=gm.rush.length)return bossStart();var q=gm.rush[gm.i],t=100;
  gshell('<div class="timer"><i id="tb"></i></div><div class="gq"><h3>'+esc(q.prompt)+'</h3><div id="go">'+q.opts.map(function(o,j){return '<button class="opt" data-j="'+j+'">'+esc(o)+'</button>'}).join('')+'</div></div><div class="gmsg" id="gmsg"></div>');
  document.querySelectorAll('#go .opt').forEach(function(b){b.onclick=function(){rushAns(+b.getAttribute('data-j'),b)}});
  gT=setInterval(function(){t-=1;var tb=document.getElementById('tb');if(tb)tb.style.width=t+'%';if(t<=0){gmStop();rushAns(-1,null)}},150)}
function rushAns(j,btn){gmStop();var q=gm.rush[gm.i];if(q.done)return;q.done=true;var ok=j>=0&&q.opts[j]===q.ans;tally(q.c.sk,ok,'game');S.w.game++;
  document.querySelectorAll('#go .opt').forEach(function(b){b.disabled=true;var o=q.opts[+b.getAttribute('data-j')];if(o===q.ans)b.classList.add('ok');else if(b===btn)b.classList.add('bad')});
  var m=document.getElementById('gmsg');
  if(ok){gm.score+=10*gm.combo;gm.combo=Math.min(gm.combo+1,5);gm.best=Math.max(gm.best,gm.combo);S.known[q.c.t]=1;delete S.miss[q.c.t];m.className='gmsg goodm';m.textContent='+'+(10*(gm.combo-1||1))+'!'}
  else{gm.hearts--;gm.combo=1;S.miss[q.c.t]=1;m.className='gmsg badm';m.textContent=(j<0?'Time! ':'')+q.c.t+': '+q.c.d;var g=document.getElementById('game');if(g)g.classList.add('shake')}
  save();gm.i++;setTimeout(rushQ,ok?700:2600)}
function bossStart(){gm.boss={hp:5,qs:choose(MC,7),k:0};bossQ()}
function bossQ(){if(gm.hearts<=0)return gameOver();var B=gm.boss;if(B.hp<=0)return victory();if(B.k>=B.qs.length){B.qs=B.qs.concat(choose(MC,4))}var q=B.qs[B.k];var order=shuf([0,1,2,3]);
  gshell('<div class="boss"><svg viewBox="0 0 130 110"><ellipse cx="65" cy="62" rx="46" ry="40" fill="#8a2be2"/><circle cx="48" cy="52" r="9" fill="#fff"/><circle cx="82" cy="52" r="9" fill="#fff"/><circle cx="50" cy="54" r="4"/><circle cx="80" cy="54" r="4"/><path d="M45 82 Q65 70 85 82" stroke="#fff" stroke-width="4" fill="none"/></svg><div class="hp"><i style="width:'+(B.hp*20)+'%"></i></div></div><div class="gq"><h3>'+esc(q.q)+'</h3><div id="go">'+order.map(function(i){return '<button class="opt" data-i="'+i+'">'+esc(q.o[i])+'</button>'}).join('')+'</div></div><div class="gmsg" id="gmsg"></div>');
  document.querySelectorAll('#go .opt').forEach(function(b){b.onclick=function(){bossAns(+b.getAttribute('data-i'),b,q)}})}
function bossAns(i,btn,q){var ok=i===0;tally(q.sk,ok,'game');S.w.boss++;save();
  document.querySelectorAll('#go .opt').forEach(function(b){b.disabled=true;if(+b.getAttribute('data-i')===0)b.classList.add('ok');else if(b===btn)b.classList.add('bad')});
  var m=document.getElementById('gmsg');if(ok){gm.boss.hp--;gm.score+=25*gm.combo;gm.combo=Math.min(gm.combo+1,5);m.className='gmsg goodm';m.textContent='Hit! '+q.w}
  else{gm.hearts--;gm.combo=1;m.className='gmsg badm';m.innerHTML=esc('The boss hits back. '+q.w)+(isWeak(q.sk)&&P.weak[q.sk]!==true?'<br><small>'+esc(P.weak[q.sk])+'</small>':'')}
  gm.boss.k++;var nb=document.createElement('div');nb.className='center';nb.innerHTML='<button class="gbtn">Next</button>';document.getElementById('game').appendChild(nb);nb.firstChild.onclick=bossQ}
function victory(){gshell('<div class="gtitle">YOU WIN!</div><p class="gsub">Score: '+gm.score+' · Best combo: x'+gm.best+'</p><div class="center"><button class="gbtn" onclick="startGame()">Play again</button></div>')}
function gameOver(){gmStop();gshell('<div class="gtitle">OUT OF HEARTS</div><p class="gsub">Score: '+gm.score+'. The words you missed come back first next time. Try Word Lab, then come back!</p><div class="center"><button class="gbtn" onclick="startGame()">Try again</button><button class="gbtn alt" onclick="startWords()">Go to Word Lab</button></div>')}

start();

/* ---------- Final retake prep add-on ---------- */
function rtHash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h.toString(36).toUpperCase()}
function rtStatus(){var R=CFG.retake,tot=0,ok=true,rows=[];
  LTS.forEach(function(l){var r=S.r[l.id];tot+=r[1];var pct=r[1]?Math.round(100*r[0]/r[1]):0,good=r[1]>=4&&pct>=80;if(!good)ok=false;rows.push({id:l.id,c:r[0],n:r[1],pct:pct,good:good})});
  if(tot<R.min)ok=false;
  var key=[nm(P.name),R.unit].concat(rows.map(function(x){return x.id+':'+x.c+'/'+x.n})).join('|')+'|'+tot+'|'+(ok?'Y':'N');
  return {ok:ok,tot:tot,rows:rows,code:rtHash(key+'|'+R.salt)}}
var _rtPlan=planBox;
planBox=function(){var st=rtStatus(),h='<div class="panel" style="border:3px solid '+(st.ok?'#1a7f37':'#b45309')+'"><h2 style="margin-top:0">'+(st.ok?'Retake earned for Unit '+CFG.retake.unit+'!':'Earn your Unit '+CFG.retake.unit+' final retake')+'</h2>';
  h+='<p>To earn it: reach <b>Level 3 (80% or higher)</b> on every learning target, with at least 4 answers on each, and at least <b>'+CFG.retake.min+' answers</b> in all. Then copy your work into Canvas by <b>Thursday, Dec 17 at 11:59 PM</b>. The retake is on finals day, Friday, Dec 18.</p><ul>';
  st.rows.forEach(function(x){h+='<li>'+(x.good?'✅':'⬜')+' <b>'+x.id+'</b>: '+(x.n?x.c+' of '+x.n+' right ('+x.pct+'%)':'not started')+(x.good?'':x.n<4?' · needs '+(4-x.n)+' more answers':' · needs 80%')+'</li>'});
  h+='<li>'+(st.tot>=CFG.retake.min?'✅':'⬜')+' Answers in all: <b>'+st.tot+' of '+CFG.retake.min+'</b></li></ul>';
  h+=st.ok?'<p><b>Next:</b> press <b>Copy my work</b> at the bottom and submit it in Canvas.</p>':'<p class="note">Every answer counts toward your percent, so slow down and read the feedback.</p>';
  return h+'</div>'+_rtPlan()};
var _rtWork=workText;
workText=function(){var st=rtStatus(),t=_rtWork().split('\n');
  var add=['FINAL RETAKE PREP, UNIT '+CFG.retake.unit+': '+(st.ok?'EARNED':'NOT YET'),'Answers in all: '+st.tot+' (need '+CFG.retake.min+')'];
  st.rows.forEach(function(x){add.push(x.id+': '+x.c+'/'+x.n+(x.good?' level 3+':' not yet'))});
  add.push('Check code: '+st.code);add.push('');
  return t.slice(0,2).concat(add,t.slice(2)).join('\n')};

</script>
