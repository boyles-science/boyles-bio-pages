var D={"lts": [{"id": "LT1", "name": "Muscle types, jobs, and structure"}, {"id": "LT2", "name": "How muscles contract"}, {"id": "LT3", "name": "Energy, fatigue, and fiber types"}, {"id": "LT4", "name": "Muscle teams, disorders, and levers"}], "mc": [{"lt": "LT1", "q": "A slide shows cells joined end to end by dark bands. Each cell is striped and branches. Where was the sample taken?", "c": "The heart wall", "w": ["A leg muscle attached to bone", "The wall of the intestine", "The wall of a blood vessel"], "why": "Striped, branched cells joined by intercalated discs are cardiac muscle."}, {"lt": "LT1", "q": "A muscle keeps squeezing food along your digestive tract for hours without you thinking about it. Which description fits this muscle best?", "c": "Smooth, involuntary, and slow to tire", "w": ["Striped, voluntary, and quick to tire", "Striped, involuntary, and branched", "Smooth, voluntary, and slow to tire"], "why": "Smooth muscle has no stripes, works without your control, and rarely tires."}, {"lt": "LT1", "q": "Your body warms up when you shiver. Which job of the muscular system is this?", "c": "Producing heat", "w": ["Maintaining posture", "Moving blood", "Moving the skeleton"], "why": "Muscle contractions release heat. Shivering uses this to warm the body."}, {"lt": "LT1", "q": "Which sequence correctly goes from the smallest muscle structure to the largest?", "c": "Myofilament, myofibril, muscle fiber, fascicle, whole muscle", "w": ["Myofibril, myofilament, fascicle, muscle fiber, whole muscle", "Muscle fiber, myofibril, myofilament, fascicle, whole muscle", "Whole muscle, fascicle, muscle fiber, myofilament, myofibril"], "why": "Myofilaments make up myofibrils. Myofibrils fill a fiber. Fibers bundle into fascicles, and fascicles make up the muscle."}, {"lt": "LT1", "q": "A student cuts a muscle in cross section. Which connective tissue wraps around each whole bundle of fibers?", "c": "Perimysium", "w": ["Epimysium", "Endomysium", "Sarcolemma"], "why": "Peri means around. The perimysium surrounds each fascicle."}, {"lt": "LT1", "q": "A fiber cannot store calcium for release. Which part is not working?", "c": "The sarcoplasmic reticulum", "w": ["The mitochondrion", "The sarcolemma", "The tendon"], "why": "The sarcoplasmic reticulum stores and releases the calcium that starts contraction."}, {"lt": "LT2", "q": "A sarcomere contracts. Which change do you see under a microscope?", "c": "The Z-discs move closer. The filaments keep their length and overlap more.", "w": ["The filaments get shorter and the Z-discs stay put.", "The Z-discs move apart as the actin lengthens.", "The myosin shortens while the actin lengthens."], "why": "Sliding filament model: filaments slide past each other. They do not change length."}, {"lt": "LT2", "q": "A patient takes a drug that blocks ACh receptors on muscle fibers. What is the direct result?", "c": "The signal cannot pass to the fiber, so the muscle does not contract.", "w": ["The muscle makes too much ATP.", "The muscle contracts but cannot relax.", "The sarcomeres shorten without calcium."], "why": "ACh must bind its receptors to pass the signal to the fiber. No binding means no contraction."}, {"lt": "LT2", "q": "Muscles stiffen after death. Which explanation fits?", "c": "No ATP is available, so myosin heads cannot detach from actin.", "w": ["Extra calcium shortens the myosin filaments.", "ATP builds up and locks the filaments.", "The nerves keep sending strong signals."], "why": "ATP is needed to release the cross-bridge. Without it, the muscle stays locked."}, {"lt": "LT2", "q": "A climber hangs from a bar and holds still. The arm muscles stay tense, but the body does not move. Which kind of contraction is this?", "c": "Isometric contraction", "w": ["Concentric contraction", "Eccentric contraction", "Tetanus that moves the load"], "why": "The muscle pulls hard, but its length does not change and nothing moves."}, {"lt": "LT2", "q": "You lower a heavy box slowly to the floor. How do your arm muscles act?", "c": "They lengthen while still pulling, which is an eccentric contraction.", "w": ["They shorten while pulling, which is a concentric contraction.", "They stay the same length, which is an isometric contraction.", "They relax completely."], "why": "An eccentric contraction acts as a brake while the muscle lengthens."}, {"lt": "LT2", "q": "Which step comes right after ACh binds its receptors on the muscle fiber?", "c": "The signal spreads along the sarcolemma and into the T-tubules.", "w": ["Cross-bridges form at once.", "Calcium is stored again.", "The nerve makes new ACh."], "why": "The order: signal arrives, ACh released, ACh binds, signal spreads, calcium released, cross-bridges form."}, {"lt": "LT3", "q": "A sprinter explodes off the blocks. For the first few seconds, which stored compound is used to remake ATP fastest?", "c": "Creatine phosphate", "w": ["Glycogen through aerobic respiration", "Fat from the hypodermis", "Protein from the nucleus"], "why": "Creatine phosphate gives the fastest ATP, but it runs out within about 10 to 15 seconds."}, {"lt": "LT3", "q": "A biopsy shows dark red fibers with lots of mitochondria that resist tiring. Which athlete is it most likely from?", "c": "A long-distance cyclist", "w": ["A weightlifter", "A 50-meter sprinter", "A shot-put thrower"], "why": "Slow-twitch fibers suit endurance. They use oxygen and resist fatigue."}, {"lt": "LT3", "q": "A swimmer finishes a race and gasps for air for a few minutes. What is the extra oxygen being used for?", "c": "Restoring ATP and creatine phosphate used during the race", "w": ["Making the muscles contract harder", "Repairing torn fibers", "Storing oxygen as ATP"], "why": "The extra oxygen repays the oxygen debt and rebuilds the energy stores."}, {"lt": "LT3", "q": "A muscle is stimulated again and again so fast that it stays in one steady, strong contraction. What is this called?", "c": "Tetanus", "w": ["Recruitment", "A single twitch", "Rigor mortis"], "why": "The twitches add up because each new signal arrives before the fiber relaxes."}, {"lt": "LT4", "q": "While you extend your leg to kick, the quadriceps act as the prime mover. Which muscle group acts as the antagonist?", "c": "The hamstrings", "w": ["The deltoids", "The tibialis anterior", "The pectoralis major"], "why": "The antagonist works against the prime mover. The hamstrings bend the knee."}, {"lt": "LT4", "q": "A load sits between the fulcrum and the effort, as in a wheelbarrow. Which lever class is this?", "c": "Second class", "w": ["First class", "Third class", "No class; it is not a lever"], "why": "In a second-class lever, the load is between the fulcrum and the effort."}, {"lt": "LT4", "q": "A seesaw has its pivot in the middle, with the effort on one side and the load on the other. Which lever class is it, and which body part works like this?", "c": "First class, like the head rocking on the top of the spine", "w": ["Second class, like a calf raise", "Third class, like a biceps curl", "First class, like a calf raise"], "why": "The fulcrum is between the effort and the load in a first-class lever."}, {"lt": "LT4", "q": "A cyclist finishes a long, hot ride, and a thigh muscle suddenly knots up, then eases when stretched. There is no bruise. What is the most likely cause?", "c": "A cramp from fatigue and low fluids and electrolytes", "w": ["A torn muscle (strain)", "Muscular dystrophy", "Atrophy from disuse"], "why": "Cramps are sudden and painful and often follow fatigue and fluid loss. A strain involves torn fibers."}, {"lt": "LT4", "q": "After six weeks in a leg cast, the leg muscles are smaller and weaker. What is this called?", "c": "Atrophy", "w": ["Muscular dystrophy", "Fibromyalgia", "Tetanus"], "why": "Atrophy is the loss of muscle size and strength from not being used."}, {"lt": "LT4", "q": "You pull a heavy door toward you by bending your elbow. Which muscle does most of the work?", "c": "Biceps brachii", "w": ["Triceps brachii", "Trapezius", "Gluteus maximus"], "why": "The biceps brachii is the prime mover for bending the elbow. The triceps does the opposite."}], "sa": [{"lt": "LT1", "q": "Name the three types of muscle tissue. For each, say if it is voluntary or involuntary.", "a": ["Skeletal: voluntary.", "Cardiac: involuntary.", "Smooth: involuntary."]}, {"lt": "LT1", "q": "Name the five jobs of the muscular system.", "a": ["Movement.", "Posture.", "Heat production.", "Circulation (the heart moves blood).", "Digestion (smooth muscle moves food along)."]}, {"lt": "LT1", "q": "Put these in order from largest to smallest: myofibril, fascicle, muscle fiber, whole muscle, myofilament.", "a": ["Whole muscle, fascicle, muscle fiber, myofibril, myofilament."]}, {"lt": "LT2", "q": "Explain the sliding filament model in your own words. What changes length, and what does not?", "a": ["Myosin heads attach to actin and pull it toward the center of the sarcomere.", "The sarcomere gets shorter.", "The actin and myosin filaments stay the same length. They overlap more."]}, {"lt": "LT2", "q": "Put these in order: calcium is released, ACh binds receptors, a nerve signal arrives, cross-bridges form, signal travels down the T-tubules.", "a": ["Nerve signal arrives (and ACh is released), ACh binds receptors, signal travels down the T-tubules, calcium is released, cross-bridges form."]}, {"lt": "LT2", "q": "Explain why a muscle needs ATP both to pull and to relax during the cross-bridge cycle.", "a": ["ATP gives the myosin head energy to reset and pull again.", "ATP binds the myosin head so it can let go of actin.", "Without ATP, the head stays attached and the muscle stays stiff."]}, {"lt": "LT3", "q": "Name the three ways a muscle makes ATP. Which is fastest, and which lasts longest?", "a": ["Creatine phosphate (fastest, lasts about 10 to 15 seconds).", "Anaerobic glycolysis (no oxygen, makes lactic acid).", "Aerobic respiration (needs oxygen, lasts longest)."]}, {"lt": "LT3", "q": "Explain why a muscle gets tired during hard exercise.", "a": ["ATP and oxygen run low.", "Wastes such as lactic acid build up.", "Fewer cross-bridges cycle, so the force drops."]}, {"lt": "LT3", "q": "Compare slow-twitch and fast-twitch fibers. Give a job each one suits.", "a": ["Slow-twitch: aerobic, many mitochondria and myoglobin, resist fatigue. Suit posture and endurance.", "Fast-twitch: contract powerfully and quickly, tire fast. Suit sprints and lifting."]}, {"lt": "LT4", "q": "What is the difference between a prime mover, a synergist, and an antagonist?", "a": ["Prime mover: does most of the work for the movement.", "Synergist: helps the prime mover.", "Antagonist: does the opposite action."]}, {"lt": "LT4", "q": "Name the three classes of lever. Where is the fulcrum, load, and effort in each?", "a": ["First class: fulcrum in the middle.", "Second class: load in the middle.", "Third class: effort in the middle."]}, {"lt": "LT4", "q": "Name one muscle disorder. Say what causes it and what it does to muscle.", "a": ["Example: myasthenia gravis. Antibodies block ACh receptors, so signals do not reach many fibers and muscles weaken with use.", "Example: muscular dystrophy. A missing protein (dystrophin) makes fibers break down.", "Other correct disorders from your notes count."]}], "pairs": [{"lt": "LT1", "term": "Epimysium", "def": "Wraps the whole muscle"}, {"lt": "LT1", "term": "Perimysium", "def": "Wraps each bundle of fibers (fascicle)"}, {"lt": "LT1", "term": "Endomysium", "def": "Wraps each muscle fiber"}, {"lt": "LT1", "term": "Sarcomere", "def": "The contracting unit between two Z-discs"}, {"lt": "LT1", "term": "Smooth muscle", "def": "Involuntary, no stripes, in hollow organs"}, {"lt": "LT2", "term": "Actin", "def": "Thin filament that myosin pulls"}, {"lt": "LT2", "term": "Myosin", "def": "Thick filament with heads that make cross-bridges"}, {"lt": "LT2", "term": "Acetylcholine (ACh)", "def": "Signal molecule released at the neuromuscular junction"}, {"lt": "LT2", "term": "Sarcoplasmic reticulum", "def": "Stores calcium inside the muscle fiber"}, {"lt": "LT2", "term": "Isometric", "def": "Muscle pulls but stays the same length"}, {"lt": "LT3", "term": "Creatine phosphate", "def": "Fastest ATP source, lasts about 10 to 15 seconds"}, {"lt": "LT3", "term": "Aerobic respiration", "def": "ATP made with oxygen, lasts the longest"}, {"lt": "LT3", "term": "Tetanus", "def": "Twitches blend into one smooth, strong pull"}, {"lt": "LT3", "term": "Slow-twitch fiber", "def": "Resists fatigue, many mitochondria and myoglobin"}, {"lt": "LT4", "term": "Prime mover", "def": "The muscle that does most of the work in a movement"}, {"lt": "LT4", "term": "Antagonist", "def": "The muscle that does the opposite action"}, {"lt": "LT4", "term": "Atrophy", "def": "Loss of muscle size from disuse"}, {"lt": "LT4", "term": "Myasthenia gravis", "def": "Antibodies block ACh receptors, so muscles weaken with use"}, {"lt": "LT4", "term": "Second-class lever", "def": "Load is between the fulcrum and the effort"}, {"lt": "LT4", "term": "Muscle cramp", "def": "Sudden, painful, involuntary contraction"}], "cases": [{"lt": "LT3", "title": "Two athletes, two muscles", "intro": "A sports lab studies a thigh muscle sample from each of two athletes. The numbers are made up for practice.", "evidence": [["A", "Athlete 1: the sample is dark red, with high myoglobin and many mitochondria. The muscle works for 90 minutes before it tires."], ["B", "Athlete 2: the sample is pale, with low myoglobin and few mitochondria. The muscle produces strong force but tires in about 2 minutes."], ["C", "Athlete 1 breathes steadily and uses oxygen to make ATP during the test."], ["D", "Both athletes wear the same brand of running shoes."]], "claim": {"q": "Which claim does the evidence support?", "opts": [["Athlete 1 has mostly slow-twitch fibers and suits endurance. Athlete 2 has mostly fast-twitch fibers and suits short, powerful efforts.", "best", "Correct. Fiber type matches how long each muscle can work and how strongly."], ["Both athletes have mostly slow-twitch fibers.", "bad", "Not quite. Athlete 2 tires fast and has few mitochondria, which fits fast-twitch fibers."], ["Athlete 1 has mostly fast-twitch fibers.", "bad", "Not quite. Dark red color, many mitochondria, and long work time fit slow-twitch fibers."], ["Shoe brand explains the difference in the muscles.", "bad", "Not quite. Shoes do not change muscle fiber type."]]}, "evid": {"q": "Pick every piece of evidence that supports the claim.", "items": [["A", true, "High myoglobin, many mitochondria, and long work time match slow-twitch fibers."], ["B", true, "Pale color, few mitochondria, strong force, and quick fatigue match fast-twitch fibers."], ["C", true, "Using oxygen to make ATP is aerobic respiration, which slow-twitch fibers rely on."], ["D", false, "Shoe brand has nothing to do with muscle fiber type."]]}, "reason": {"q": "Which reasoning links the evidence to the claim?", "opts": [["Slow-twitch fibers make ATP with oxygen, so they resist fatigue. Many mitochondria and myoglobin support that. Fast-twitch fibers use quick energy sources and tire fast, so they give strong, short efforts.", "best", "Correct. The structure matches the energy source and the job."], ["Fast-twitch fibers have many mitochondria, so they never tire.", "bad", "Fast-twitch fibers have few mitochondria and tire quickly."], ["Slow-twitch fibers contract with more force than fast-twitch fibers, which is why they last longer.", "bad", "Slow-twitch fibers give less force. They last longer because they use oxygen."], ["Myoglobin stores oxygen, so more of it gives more strength.", "partial", "Part is right: myoglobin stores oxygen. It helps endurance, not strength."]]}}]};
var app=document.getElementById('app');
var results={};  // lt id -> [right, tried]
D.lts.forEach(function(l){results[l.id]=[0,0]});
var used={};
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function shuf(a){a=a.slice();for(var j=a.length-1;j>0;j--){var r=Math.floor(Math.random()*(j+1));var t=a[j];a[j]=a[r];a[r]=t}return a}
function tally(lt,ok){if(!results[lt])results[lt]=[0,0];results[lt][1]++;if(ok)results[lt][0]++}
function ltName(id){var n=id;D.lts.forEach(function(l){if(l.id===id)n=l.id+': '+l.name});return n}
function home(){
  var h='<h2>Choose your study path</h2><div class="cards">'+
  '<button class="card" onclick="startQuest()"><b>1. Question Quest</b><span>Short-answer questions, like a traditional review. Write your answer, then check it.</span></button>'+
  '<button class="card" onclick="startGame()"><b>2. Streak Challenge</b><span>A game. Answer 12 questions. Build a streak. Three misses and the round ends.</span></button>'+
  '<button class="card" onclick="startMatch()"><b>3. Match-Up</b><span>Match each term to what it means. Five pairs a round.</span></button>'+
  '<button class="card" onclick="startCase()"><b>4. Prove It Case</b><span>Read a made-up case. Build a claim, pick the evidence, and explain your reasoning.</span></button>'+
  '</div><p class="note">Not sure where to start? Take the practice test in Canvas first. A miss on a learning target tells you which path to try. Come back here as often as you like.</p>'+
  planBox();
  app.innerHTML=h;window.scrollTo(0,0);
}
function planBox(){
  var any=false,rows='';
  D.lts.forEach(function(l){var r=results[l.id];if(r[1]>0)any=true;
    var pct=r[1]?Math.round(100*r[0]/r[1]):null;
    var s=pct===null?'Not tried yet':(pct>=85?'Strong':(pct>=60?'Getting there':'Needs more practice'));
    rows+='<tr><td>'+esc(l.id+': '+l.name)+'</td><td>'+(r[1]?r[0]+' of '+r[1]:'-')+'</td><td>'+s+'</td></tr>'});
  return '<div class="sum"><h3>My study plan</h3><table class="plan"><tr><th>Learning target</th><th>Right so far</th><th>Where you are</th></tr>'+rows+'</table>'+
   (any?'<p class="note">Pick a path again and work on the targets that say "Needs more practice" or "Not tried yet." This chart resets when you close the page.</p>':'<p class="note">This chart fills in as you work. It resets when you close the page.</p>')+'</div>';
}
function back(){return '<button class="go alt" onclick="home()">Back to the four paths</button>'}

/* ---------- 1. Question Quest ---------- */
var qi=0,ql=[];
function startQuest(){ql=shuf(D.sa);qi=0;renderQ()}
function renderQ(){
  if(qi>=ql.length){app.innerHTML='<h2>Question Quest finished</h2><p>You answered '+ql.length+' questions.</p>'+planBox()+'<button class="go" onclick="startQuest()">Do it again</button>'+back();return}
  var q=ql[qi];
  app.innerHTML='<span class="lt">Question '+(qi+1)+' of '+ql.length+' &middot; '+esc(ltName(q.lt))+'</span><h2>'+esc(q.q)+'</h2>'+
  '<textarea id="mine" aria-label="Your answer" placeholder="Write your answer here. Use full sentences."></textarea>'+
  '<div id="key"></div><button class="go" id="show" onclick="showA()">Check my answer</button>'+back();
}
function showA(){var q=ql[qi];var h='<div class="ans"><b>A strong answer includes:</b><ul>';q.a.forEach(function(x){h+='<li>'+esc(x)+'</li>'});h+='</ul></div><p><b>Compare your answer. How did you do?</b></p>'+
  '<button class="go" onclick="rate(true)">I got it</button><button class="go alt" onclick="rate(false)">Not yet</button>';
  document.getElementById('key').innerHTML=h;document.getElementById('show').disabled=true}
function rate(ok){tally(ql[qi].lt,ok);qi++;renderQ()}

/* ---------- 2. Streak Challenge ---------- */
var g;
function startGame(){var qs=shuf(D.mc).slice(0,12);g={qs:qs,i:0,streak:0,best:0,score:0,miss:0};renderG()}
function renderG(){
  if(g.i>=g.qs.length||g.miss>=3){var done=g.i>=g.qs.length;
    app.innerHTML='<h2>'+(done?'Round complete':'Round over')+'</h2><div class="stats"><div>Score: '+g.score+'</div><div>Best streak: '+g.best+'</div></div>'+
    '<p>'+(done?'You made it through all '+g.qs.length+' questions.':'Three misses ended the round. Read the feedback and try again.')+'</p>'+planBox()+'<button class="go" onclick="startGame()">Play again</button>'+back();return}
  var q=g.qs[g.i];var order=shuf([q.c].concat(q.w));g.cur=q;
  var h='<div class="stats"><div>Score: '+g.score+'</div><div>Streak: '+g.streak+'</div><div>Misses: '+g.miss+' of 3</div></div><span class="lt">Question '+(g.i+1)+' of '+g.qs.length+' &middot; '+esc(ltName(q.lt))+'</span><h2>'+esc(q.q)+'</h2><div id="opts">';
  order.forEach(function(o,i){h+='<button class="opt" data-v="'+i+'">'+esc(o)+'</button>'});
  app.innerHTML=h+'</div><div id="gfb"></div><div id="gnext"></div>'+back();
  var bs=app.querySelectorAll('.opt');bs.forEach(function(b,i){b.onclick=function(){gpick(b,order[i])}});
}
function gpick(b,val){var q=g.cur;var ok=(val===q.c);tally(q.lt,ok);
  app.querySelectorAll('.opt').forEach(function(x){x.onclick=null;if(x.textContent===q.c)x.className='opt ok'});
  if(!ok)b.className='opt bad';
  if(ok){g.streak++;g.score+=10+Math.min(g.streak-1,5)*2;if(g.streak>g.best)g.best=g.streak}else{g.streak=0;g.miss++}
  document.getElementById('gfb').innerHTML='<div class="fb '+(ok?'ok':'bad')+'" role="status"><b>'+(ok?'Correct. ':'Not quite. ')+'</b>'+esc(q.why)+'</div>';
  document.getElementById('gnext').innerHTML='<button class="go" onclick="g.i++;renderG()">Next</button>'}

/* ---------- 3. Match-Up ---------- */
var m;
function startMatch(){m={all:shuf(D.pairs),round:0,selT:null,selD:null,wrong:0};renderM()}
function renderM(){
  var start=m.round*5,set=m.all.slice(start,start+5);
  if(!set.length){app.innerHTML='<h2>Match-Up finished</h2><p>You matched every pair.</p>'+planBox()+'<button class="go" onclick="startMatch()">Play again</button>'+back();return}
  m.set=set;m.left=set.length;m.terms=shuf(set.map(function(_,i){return i}));m.defs=shuf(set.map(function(_,i){return i}));m.selT=m.selD=null;
  var h='<span class="lt">Round '+(m.round+1)+' of '+Math.ceil(m.all.length/5)+'</span><h2>Match each term to what it means</h2><p class="note">Pick a term on the left, then pick its match on the right.</p><div class="match"><div id="mt"></div><div id="md"></div></div><div id="mfb"></div>'+back();
  app.innerHTML=h;
  var mt=document.getElementById('mt'),md=document.getElementById('md');
  m.terms.forEach(function(i){var b=document.createElement('button');b.className='m';b.textContent=set[i].term;b.dataset.i=i;b.onclick=function(){mpick('t',i,b)};mt.appendChild(b)});
  m.defs.forEach(function(i){var b=document.createElement('button');b.className='m';b.textContent=set[i].def;b.dataset.i=i;b.onclick=function(){mpick('d',i,b)};md.appendChild(b)});
}
function mpick(side,i,b){if(b.classList.contains('gone'))return;
  var box=document.getElementById(side==='t'?'mt':'md');box.querySelectorAll('.m').forEach(function(x){x.classList.remove('sel')});b.classList.add('sel');
  if(side==='t')m.selT=[i,b];else m.selD=[i,b];
  if(m.selT&&m.selD){var a=m.selT,c=m.selD;var ok=(a[0]===c[0]);tally(m.set[a[0]].lt,ok);
    if(ok){[a[1],c[1]].forEach(function(x){x.className='m gone'});m.left--;document.getElementById('mfb').innerHTML='<div class="fb ok" role="status">Correct match.</div>';
      if(!m.left){document.getElementById('mfb').innerHTML+='<button class="go" onclick="m.round++;renderM()">Next round</button>'}}
    else{[a[1],c[1]].forEach(function(x){x.className='m wrong'});document.getElementById('mfb').innerHTML='<div class="fb bad" role="status">Not a match. Try again.</div>';
      setTimeout(function(){[a[1],c[1]].forEach(function(x){if(!x.classList.contains('gone'))x.className='m'})},700)}
    m.selT=m.selD=null}}

/* ---------- 4. Prove It Case ---------- */
var cs,cstep;
function startCase(){cs=D.cases[Math.floor(Math.random()*D.cases.length)];cstep=0;renderC()}
function renderC(){
  var h='<h2>'+esc(cs.title)+'</h2><p>'+esc(cs.intro)+' <i>This case is made up for practice.</i></p><div class="ev">';
  cs.evidence.forEach(function(e){h+='<p><b>Evidence '+e[0]+'.</b> '+esc(e[1])+'</p>'});h+='</div>';
  h+='<div class="bar">';for(var i=0;i<3;i++)h+='<span class="'+(i<cstep?'done':(i===cstep?'on':''))+'"></span>';h+='</div>';
  if(cstep===3){app.innerHTML='<h2>'+esc(cs.title)+': done</h2><div class="sum"><p><b>Claim:</b> '+esc(cs.claim.opts[0][0])+'</p><p><b>Reasoning:</b> '+esc(cs.reason.opts[0][0])+'</p></div>'+planBox()+'<button class="go" onclick="startCase()">Try another case</button>'+back();return}
  if(cstep===1){h+=evStep()}else{h+=chStep(cstep===0?cs.claim:cs.reason,cstep===0?'claim':'reason')}
  app.innerHTML=h+back();
}
function chStep(c,k){var h='<h3>'+esc(c.q)+'</h3><div>';shuf(c.opts.map(function(_,i){return i})).forEach(function(i){h+='<button class="opt" data-i="'+i+'" onclick="cpick('+i+',this)">'+esc(c.opts[i][0])+'</button><div id="cf'+i+'"></div>'});
  return h+'</div><button class="go" id="cnext" disabled onclick="cstep++;renderC()">Next</button>'}
function cpick(i,btn){var c=cstep===0?cs.claim:cs.reason;var o=c.opts[i];var cls=o[1]==='best'?'ok':(o[1]==='partial'?'part':'bad');
  btn.className='opt '+cls;document.getElementById('cf'+i).innerHTML='<div class="fb '+cls+'" role="status">'+esc(o[2])+'</div>';
  if(o[1]==='best'){tally(cs.lt,true);document.getElementById('cnext').disabled=false;document.querySelectorAll('.opt').forEach(function(b){b.onclick=null})}else{tally(cs.lt,false);btn.onclick=null}}
function evStep(){var e=cs.evid;var h='<h3>'+esc(e.q)+'</h3><div id="chk">';e.items.forEach(function(it,i){var ev=cs.evidence.filter(function(x){return x[0]===it[0]})[0];
  h+='<label class="chk"><input type="checkbox" value="'+i+'"><span><b>Evidence '+it[0]+'.</b> '+esc(ev[1])+'</span></label><div id="ef'+i+'"></div>'});
  return h+'</div><button class="go" onclick="checkEv()">Check</button><div id="evsum"></div><button class="go" id="cnext" disabled onclick="cstep++;renderC()">Next</button>'}
function checkEv(){var all=true;document.querySelectorAll('#chk input').forEach(function(inp){var i=+inp.value;var it=cs.evid.items[i];var good=(inp.checked===it[1]);if(!good)all=false;
  document.getElementById('ef'+i).innerHTML='<div class="fb '+(good?'ok':'bad')+'" role="status">'+(good?(it[1]?'Supports the claim. ':'Correctly left out. '):(it[1]?'You missed this one. ':'This one does not belong. '))+esc(it[2])+'</div>'});
  tally(cs.lt,all);
  document.getElementById('evsum').innerHTML=all?'<div class="fb ok" role="status"><b>All correct.</b></div>':'<div class="fb part" role="status">Some choices need another look. Change them and press Check again.</div>';
  if(all)document.getElementById('cnext').disabled=false}
home();
</script></body></html>
