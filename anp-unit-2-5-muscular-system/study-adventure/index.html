, "why": "The sarcoplasmic reticulum stores calcium. Without calcium, the binding sites on actin stay covered."}, {"lt": "LT2", "q": "What happens to the sarcomere when a muscle contracts?", "c": "It gets shorter. Actin and myosin stay the same length and overlap more.", "w": ["It gets shorter because the myosin gets shorter.", "It stays the same length, but the myosin moves to one end.", "It gets longer because the actin gets longer."], "why": "This is the sliding filament model. The filaments slide past each other. They do not change length."}, {"lt": "LT2", "q": "A toxin stops the motor neuron from releasing ACh. What happens to the muscle?", "c": "It cannot contract, because the signal never crosses to the muscle fiber.", "w": ["It contracts and cannot relax.", "It cannot contract, because ATP cannot reach the sarcomeres.", "It contracts more weakly, because fewer mitochondria work."], "why": "ACh carries the signal across the gap (synapse) to the muscle fiber. No ACh means no signal, no calcium release, and no contraction."}, {"lt": "LT2", "q": "After death, cells stop making ATP and muscles become stiff. Why?", "c": "Myosin heads stay attached to actin, because ATP is needed to let go.", "w": ["Myosin heads cannot pull, so the muscle stops contracting.", "Calcium leaves the muscle, so the sarcomeres lock.", "The muscle fibers shrink and pull tight."], "why": "ATP is needed for the myosin head to release actin. Without ATP, the cross-bridges stay locked. This is rigor mortis."}, {"lt": "LT2", "q": "You hold a plank. Your abdominal muscles pull but do not change length. What type of contraction is this?", "c": "Isometric", "w": ["Concentric", "Eccentric", "Isotonic shortening"], "why": "In an isometric contraction the muscle pulls but the load does not move, so the length stays the same."}, {"lt": "LT2", "q": "You sit down slowly into a chair. Your quadriceps lengthen while they still pull. What type of contraction is this?", "c": "Eccentric", "w": ["Concentric", "Isometric", "Tetanic"], "why": "In an eccentric contraction the muscle lengthens while it pulls. It acts as a brake."}, {"lt": "LT2", "q": "Which event comes first when you decide to lift a pencil?", "c": "A nerve signal arrives at the neuromuscular junction.", "w": ["Calcium is released from the sarcoplasmic reticulum.", "Cross-bridges form.", "ACh binds to its receptors."], "why": "The order is: nerve signal, ACh released, ACh binds receptors, signal along the T-tubules, calcium released, cross-bridges form."}, {"lt": "LT3", "q": "Which energy source supplies most of the new ATP in the first 10 seconds of all-out effort?", "c": "Creatine phosphate", "w": ["Aerobic respiration", "Anaerobic glycolysis", "ATP made in the nucleus"], "why": "Creatine phosphate is fast but runs out in about 10 to 15 seconds. Glycolysis then takes over."}, {"lt": "LT3", "q": "A muscle sample is dark red with high myoglobin and many mitochondria. It does not tire for over an hour. Which fiber type is it?", "c": "Slow-twitch", "w": ["Fast-twitch", "Cardiac", "Smooth"], "why": "Slow-twitch fibers use aerobic respiration and resist fatigue. They suit endurance, such as a marathon."}, {"lt": "LT3", "q": "You keep breathing hard for several minutes after a run. Why?", "c": "Your body is repaying the oxygen debt and rebuilding its energy stores.", "w": ["Your muscles are still contracting as hard as during the run.", "Lactic acid is tearing your muscle fibers, and oxygen repairs them.", "Muscles store oxygen as ATP."], "why": "Extra oxygen helps rebuild ATP and creatine phosphate. Muscles do not store oxygen as ATP."}, {"lt": "LT3", "q": "Signals reach a muscle so fast that the twitches blend into one smooth, strong pull. What is this called?", "c": "Tetanus", "w": ["Recruitment", "Fatigue", "A single twitch"], "why": "Each new signal arrives before the fiber relaxes, so the twitches add up. This is tetanus (summation at a high rate)."}, {"lt": "LT4", "q": "In a biceps curl, the biceps is the prime mover. What does the antagonist, the triceps, do?", "c": "It straightens the elbow.", "w": ["It helps the biceps bend the elbow.", "It lifts the arm.", "It holds the wrist still."], "why": "The antagonist does the opposite action of the prime mover. A synergist helps the prime mover."}, {"lt": "LT4", "q": "You rise onto your tiptoes. The ball of your foot is the pivot, your weight is in the middle, and the calf pulls the heel. Which lever class is this?", "c": "Second class, because the load is in the middle.", "w": ["First class, because the pivot is in the middle.", "Second class, because the effort is in the middle.", "Third class, because the effort is in the middle."], "why": "In a second-class lever, the load is between the fulcrum and the effort."}, {"lt": "LT4", "q": "You nod your head. Where is the fulcrum of this first-class lever?", "c": "In the middle, between the effort and the load.", "w": ["At one end, with the load in the middle.", "At one end, with the effort in the middle.", "In the middle, where the neck muscles pull."], "why": "In a first-class lever the fulcrum sits between the effort and the load. Your skull rocks on the top of your spine."}, {"lt": "LT4", "q": "A soccer player runs hard for 80 minutes on a hot day. A calf becomes hard and very painful. There is no swelling, and stretching helps. What is most likely?", "c": "A muscle cramp from tired muscles, water loss, and low electrolytes", "w": ["A muscle strain from torn fibers", "Muscular dystrophy that has just started", "Atrophy"], "why": "A cramp is a sudden, painful, involuntary contraction. A strain involves torn fibers and often swelling."}, {"lt": "LT4", "q": "An astronaut returns from 6 months in space. Her leg muscles are smaller and weaker. What is this?", "c": "Atrophy, because her muscles did little work in low gravity", "w": ["Muscular dystrophy, because she is missing dystrophin", "Fibromyalgia, because pain signals became too strong", "A muscle strain"], "why": "Atrophy is a loss of muscle size from disuse."}, {"lt": "LT4", "q": "You bend your knee to kick a ball backward. Which muscle is the prime mover?", "c": "Hamstrings", "w": ["Quadriceps", "Deltoid", "Tibialis anterior"], "why": "The hamstrings bend the knee. The quadriceps straighten the knee, so they are the antagonist."}], "sa": [{"lt": "LT1", "q": "Name the three types of muscle tissue. For each, say if it is voluntary or involuntary.", "a": ["Skeletal: voluntary.", "Cardiac: involuntary.", "Smooth: involuntary."]}, {"lt": "LT1", "q": "Name the five jobs of the muscular system.", "a": ["Movement.", "Posture.", "Heat production.", "Circulation (the heart moves blood).", "Digestion (smooth muscle moves food along)."]}, {"lt": "LT1", "q": "Put these in order from largest to smallest: myofibril, fascicle, muscle fiber, whole muscle, myofilament.", "a": ["Whole muscle, fascicle, muscle fiber, myofibril, myofilament."]}, {"lt": "LT2", "q": "Explain the sliding filament model in your own words. What changes length, and what does not?", "a": ["Myosin heads attach to actin and pull it toward the center of the sarcomere.", "The sarcomere gets shorter.", "The actin and myosin filaments stay the same length. They overlap more."]}, {"lt": "LT2", "q": "Put these in order: calcium is released, ACh binds receptors, a nerve signal arrives, cross-bridges form, signal travels down the T-tubules.", "a": ["Nerve signal arrives (and ACh is released), ACh binds receptors, signal travels down the T-tubules, calcium is released, cross-bridges form."]}, {"lt": "LT2", "q": "What two things does ATP do in the cross-bridge cycle?", "a": ["It gives the myosin head energy to reset (cock) for the next pull.", "It lets the myosin head let go of actin."]}, {"lt": "LT3", "q": "Name the three ways a muscle makes ATP. Which is fastest, and which lasts longest?", "a": ["Creatine phosphate (fastest, lasts about 10 to 15 seconds).", "Anaerobic glycolysis (no oxygen, makes lactic acid).", "Aerobic respiration (needs oxygen, lasts longest)."]}, {"lt": "LT3", "q": "Explain why a muscle gets tired during hard exercise.", "a": ["ATP and oxygen run low.", "Wastes such as lactic acid build up.", "Fewer cross-bridges cycle, so the force drops."]}, {"lt": "LT3", "q": "Compare slow-twitch and fast-twitch fibers. Give a job each one suits.", "a": ["Slow-twitch: aerobic, many mitochondria and myoglobin, resist fatigue. Suit posture and endurance.", "Fast-twitch: contract powerfully and quickly, tire fast. Suit sprints and lifting."]}, {"lt": "LT4", "q": "What is the difference between a prime mover, a synergist, and an antagonist?", "a": ["Prime mover: does most of the work for the movement.", "Synergist: helps the prime mover.", "Antagonist: does the opposite action."]}, {"lt": "LT4", "q": "Name the three classes of lever. Where is the fulcrum, load, and effort in each?", "a": ["First class: fulcrum in the middle.", "Second class: load in the middle.", "Third class: effort in the middle."]}, {"lt": "LT4", "q": "Name one muscle disorder. Say what causes it and what it does to muscle.", "a": ["Example: myasthenia gravis. Antibodies block ACh receptors, so signals do not reach many fibers and muscles weaken with use.", "Example: muscular dystrophy. A missing protein (dystrophin) makes fibers break down.", "Other correct disorders from your notes count."]}], "pairs": [{"lt": "LT1", "term": "Epimysium", "def": "Wraps the whole muscle"}, {"lt": "LT1", "term": "Perimysium", "def": "Wraps each bundle of fibers (fascicle)"}, {"lt": "LT1", "term": "Endomysium", "def": "Wraps each muscle fiber"}, {"lt": "LT1", "term": "Sarcomere", "def": "The contracting unit between two Z-discs"}, {"lt": "LT1", "term": "Smooth muscle", "def": "Involuntary, no stripes, in hollow organs"}, {"lt": "LT2", "term": "Actin", "def": "Thin filament that myosin pulls"}, {"lt": "LT2", "term": "Myosin", "def": "Thick filament with heads that make cross-bridges"}, {"lt": "LT2", "term": "Acetylcholine (ACh)", "def": "Signal molecule released at the neuromuscular junction"}, {"lt": "LT2", "term": "Sarcoplasmic reticulum", "def": "Stores calcium inside the muscle fiber"}, {"lt": "LT2", "term": "Isometric", "def": "Muscle pulls but stays the same length"}, {"lt": "LT3", "term": "Creatine phosphate", "def": "Fastest ATP source, lasts about 10 to 15 seconds"}, {"lt": "LT3", "term": "Aerobic respiration", "def": "ATP made with oxygen, lasts the longest"}, {"lt": "LT3", "term": "Tetanus", "def": "Twitches blend into one smooth, strong pull"}, {"lt": "LT3", "term": "Slow-twitch fiber", "def": "Resists fatigue, many mitochondria and myoglobin"}, {"lt": "LT4", "term": "Prime mover", "def": "The muscle that does most of the work in a movement"}, {"lt": "LT4", "term": "Antagonist", "def": "The muscle that does the opposite action"}, {"lt": "LT4", "term": "Atrophy", "def": "Loss of muscle size from disuse"}, {"lt": "LT4", "term": "Myasthenia gravis", "def": "Antibodies block ACh receptors, so muscles weaken with use"}, {"lt": "LT4", "term": "Second-class lever", "def": "Load is between the fulcrum and the effort"}, {"lt": "LT4", "term": "Muscle cramp", "def": "Sudden, painful, involuntary contraction"}], "cases": [{"lt": "LT2", "title": "A patient with tired muscles", "intro": "A 34-year-old patient visits a doctor.", "evidence": [["A", "The eyelids droop by the end of each day. Chewing gets hard near the end of a meal. Strength comes back after rest."], ["B", "A blood test finds antibodies that attach to the ACh receptors on muscle fibers."], ["C", "The doctor stimulates a nerve five times in a row. The muscle response drops from 100 percent to 72 percent of the first response."], ["D", "A muscle sample looks normal. The fibers are normal size and the protein dystrophin is present."]], "claim": {"q": "Which claim does the evidence support?", "opts": [["The patient most likely has myasthenia gravis.", "best", "Correct. The evidence points to a problem at the neuromuscular junction."], ["The patient most likely has muscular dystrophy.", "bad", "Not quite. Dystrophin is present (Evidence D) and the weakness changes within a day."], ["The patient most likely has atrophy.", "bad", "Not quite. The fibers are normal size (Evidence D)."], ["The patient most likely has a muscle strain.", "bad", "Not quite. There is no injury, and a strain does not come with antibodies."]]}, "evid": {"q": "Pick every piece of evidence that supports the claim.", "items": [["A", true, "Weakness that grows with use and eases with rest fits a problem at the neuromuscular junction."], ["B", true, "Antibodies on ACh receptors mean the immune system is attacking the receptors."], ["C", true, "A shrinking response to repeated signals means fewer fibers respond each time."], ["D", false, "Normal fibers and normal dystrophin do not support myasthenia gravis. They rule out dystrophy and atrophy, but they do not point to it."]]}, "reason": {"q": "Which reasoning links the evidence to the claim?", "opts": [["Antibodies block the ACh receptors, so fewer fibers get the signal. Less calcium is released and fewer cross-bridges form. The muscle weakens, especially with repeated use.", "best", "Correct. This follows the chain from receptor to sarcomere."], ["Antibodies destroy dystrophin, so the fibers break down and the muscle gets smaller.", "bad", "That describes a different problem. Dystrophin is present here."], ["Antibodies block the ACh receptors, so the muscle makes more ATP and tires.", "partial", "Part is right: the receptors are blocked. Blocked receptors do not make more ATP."], ["The eyelids droop because the fibers tore during chewing.", "bad", "There is no sign of an injury."]]}}]};
var app=document.getElementById('app');
var results={};  // lt id -> [right, tried]
D.lts.forEach(function(l){results[l.id]=[0,0]});
var used={};
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function shuf(a){a=a.slice();for(var j=a.length-1;j>0;j--){var r=Math.floor(Math.random()*(j+1));var t=a[j];a[j]=a[r];a[r]=t}return a}
function tally(lt,ok){if(!results[lt])results[lt]=[0,0];results[lt][1]++;if(ok)results[lt][0]++}
function ltName(id){var n=id;D.lts.forEach(function(l){if(l.id===id)n=l.id+': '+l.name});return n}
function home(){
  var h='<h2>Choose your study path</h2><div class="cards">'+
  '<button class="card" onclick="startQuest()"><b>1. Question Quest</b><span>Short-answer questions, like a traditional review. Write your answer, then check it.</span></button>'+
  '<button class="card" onclick="startGame()"><b>2. Streak Challenge</b><span>A game. Answer 12 questions. Build a streak. Three misses and the round ends.</span></button>'+
  '<button class="card" onclick="startMatch()"><b>3. Match-Up</b><span>Match each term to what it means. Five pairs a round.</span></button>'+
  '<button class="card" onclick="startCase()"><b>4. Prove It Case</b><span>Read a made-up case. Build a claim, pick the evidence, and explain your reasoning.</span></button>'+
  '</div><p class="note">Not sure where to start? Take the practice test in Canvas first. A miss on a learning target tells you which path to try. Come back here as often as you like.</p>'+
  planBox();
  app.innerHTML=h;window.scrollTo(0,0);
}
function planBox(){
  var any=false,rows='';
  D.lts.forEach(function(l){var r=results[l.id];if(r[1]>0)any=true;
    var pct=r[1]?Math.round(100*r[0]/r[1]):null;
    var s=pct===null?'Not tried yet':(pct>=85?'Strong':(pct>=60?'Getting there':'Needs more practice'));
    rows+='<tr><td>'+esc(l.id+': '+l.name)+'</td><td>'+(r[1]?r[0]+' of '+r[1]:'-')+'</td><td>'+s+'</td></tr>'});
  return '<div class="sum"><h3>My study plan</h3><table class="plan"><tr><th>Learning target</th><th>Right so far</th><th>Where you are</th></tr>'+rows+'</table>'+
   (any?'<p class="note">Pick a path again and work on the targets that say "Needs more practice" or "Not tried yet." This chart resets when you close the page.</p>':'<p class="note">This chart fills in as you work. It resets when you close the page.</p>')+'</div>';
}
function back(){return '<button class="go alt" onclick="home()">Back to the four paths</button>'}

/* ---------- 1. Question Quest ---------- */
var qi=0,ql=[];
function startQuest(){ql=shuf(D.sa);qi=0;renderQ()}
function renderQ(){
  if(qi>=ql.length){app.innerHTML='<h2>Question Quest finished</h2><p>You answered '+ql.length+' questions.</p>'+planBox()+'<button class="go" onclick="startQuest()">Do it again</button>'+back();return}
  var q=ql[qi];
  app.innerHTML='<span class="lt">Question '+(qi+1)+' of '+ql.length+' &middot; '+esc(ltName(q.lt))+'</span><h2>'+esc(q.q)+'</h2>'+
  '<textarea id="mine" aria-label="Your answer" placeholder="Write your answer here. Use full sentences."></textarea>'+
  '<div id="key"></div><button class="go" id="show" onclick="showA()">Check my answer</button>'+back();
}
function showA(){var q=ql[qi];var h='<div class="ans"><b>A strong answer includes:</b><ul>';q.a.forEach(function(x){h+='<li>'+esc(x)+'</li>'});h+='</ul></div><p><b>Compare your answer. How did you do?</b></p>'+
  '<button class="go" onclick="rate(true)">I got it</button><button class="go alt" onclick="rate(false)">Not yet</button>';
  document.getElementById('key').innerHTML=h;document.getElementById('show').disabled=true}

/* ---------- 2. Streak Challenge ---------- */
var g;
function startGame(){var qs=shuf(D.mc).slice(0,12);g={qs:qs,i:0,streak:0,best:0,score:0,miss:0};renderG()}
function renderG(){
  if(g.i>=g.qs.length||g.miss>=3){var done=g.i>=g.qs.length;
    app.innerHTML='<h2>'+(done?'Round complete':'Round over')+'</h2><div class="stats"><div>Score: '+g.score+'</div><div>Best streak: '+g.best+'</div></div>'+
    '<p>'+(done?'You made it through all '+g.qs.length+' questions.':'Three misses ended the round. Read the feedback and try again.')+'</p>'+planBox()+'<button class="go" onclick="startGame()">Play again</button>'+back();return}
  var q=g.qs[g.i];var order=shuf([q.c].concat(q.w));g.cur=q;
  var h='<div class="stats"><div>Score: '+g.score+'</div><div>Streak: '+g.streak+'</div><div>Misses: '+g.miss+' of 3</div></div><span class="lt">Question '+(g.i+1)+' of '+g.qs.length+' &middot; '+esc(ltName(q.lt))+'</span><h2>'+esc(q.q)+'</h2><div id="opts">';
  order.forEach(function(o,i){h+='<button class="opt" data-v="'+i+'">'+esc(o)+'</button>'});
  app.innerHTML=h+'</div><div id="gfb"></div><div id="gnext"></div>'+back();
  var bs=app.querySelectorAll('.opt');bs.forEach(function(b,i){b.onclick=function(){gpick(b,order[i])}});
}
function gpick(b,val){var q=g.cur;var ok=(val===q.c);tally(q.lt,ok);
  app.querySelectorAll('.opt').forEach(function(x){x.onclick=null;if(x.textContent===q.c)x.className='opt ok'});
  if(!ok)b.className='opt bad';
  if(ok){g.streak++;g.score+=10+Math.min(g.streak-1,5)*2;if(g.streak>g.best)g.best=g.streak}else{g.streak=0;g.miss++}
  document.getElementById('gfb').innerHTML='<div class="fb '+(ok?'ok':'bad')+'" role="status"><b>'+(ok?'Correct. ':'Not quite. ')+'</b>'+esc(q.why)+'</div>';
  document.getElementById('gnext').innerHTML='<button class="go" onclick="g.i++;renderG()">Next</button>'}

/* ---------- 3. Match-Up ---------- */
var m;
function startMatch(){m={all:shuf(D.pairs),round:0,selT:null,selD:null,wrong:0};renderM()}
function renderM(){
  var start=m.round*5,set=m.all.slice(start,start+5);
  if(!set.length){app.innerHTML='<h2>Match-Up finished</h2><p>You matched every pair.</p>'+planBox()+'<button class="go" onclick="startMatch()">Play again</button>'+back();return}
  m.set=set;m.left=set.length;m.terms=shuf(set.map(function(_,i){return i}));m.defs=shuf(set.map(function(_,i){return i}));m.selT=m.selD=null;
  var h='<span class="lt">Round '+(m.round+1)+' of '+Math.ceil(m.all.length/5)+'</span><h2>Match each term to what it means</h2><p class="note">Pick a term on the left, then pick its match on the right.</p><div class="match"><div id="mt"></div><div id="md"></div></div><div id="mfb"></div>'+back();
  app.innerHTML=h;
  var mt=document.getElementById('mt'),md=document.getElementById('md');
  m.terms.forEach(function(i){var b=document.createElement('button');b.className='m';b.textContent=set[i].term;b.dataset.i=i;b.onclick=function(){mpick('t',i,b)};mt.appendChild(b)});
  m.defs.forEach(function(i){var b=document.createElement('button');b.className='m';b.textContent=set[i].def;b.dataset.i=i;b.onclick=function(){mpick('d',i,b)};md.appendChild(b)});
}
function mpick(side,i,b){if(b.classList.contains('gone'))return;
  var box=document.getElementById(side==='t'?'mt':'md');box.querySelectorAll('.m').forEach(function(x){x.classList.remove('sel')});b.classList.add('sel');
  if(side==='t')m.selT=[i,b];else m.selD=[i,b];
  if(m.selT&&m.selD){var a=m.selT,c=m.selD;var ok=(a[0]===c[0]);tally(m.set[a[0]].lt,ok);
    if(ok){[a[1],c[1]].forEach(function(x){x.className='m gone'});m.left--;document.getElementById('mfb').innerHTML='<div class="fb ok" role="status">Correct match.</div>';
      if(!m.left){document.getElementById('mfb').innerHTML+='<button class="go" onclick="m.round++;renderM()">Next round</button>'}}
    else{[a[1],c[1]].forEach(function(x){x.className='m wrong'});document.getElementById('mfb').innerHTML='<div class="fb bad" role="status">Not a match. Try again.</div>';
      setTimeout(function(){[a[1],c[1]].forEach(function(x){if(!x.classList.contains('gone'))x.className='m'})},700)}
    m.selT=m.selD=null}}

/* ---------- 4. Prove It Case ---------- */
var cs,cstep;
function startCase(){cs=D.cases[Math.floor(Math.random()*D.cases.length)];cstep=0;renderC()}
function renderC(){
  var h='<h2>'+esc(cs.title)+'</h2><p>'+esc(cs.intro)+' <i>This case is made up for practice.</i></p><div class="ev">';
  cs.evidence.forEach(function(e){h+='<p><b>Evidence '+e[0]+'.</b> '+esc(e[1])+'</p>'});h+='</div>';
  h+='<div class="bar">';for(var i=0;i<3;i++)h+='<span class="'+(i<cstep?'done':(i===cstep?'on':''))+'"></span>';h+='</div>';
  if(cstep===3){app.innerHTML='<h2>'+esc(cs.title)+': done</h2><div class="sum"><p><b>Claim:</b> '+esc(cs.claim.opts[0][0])+'</p><p><b>Reasoning:</b> '+esc(cs.reason.opts[0][0])+'</p></div>'+planBox()+'<button class="go" onclick="startCase()">Try another case</button>'+back();return}
  if(cstep===1){h+=evStep()}else{h+=chStep(cstep===0?cs.claim:cs.reason,cstep===0?'claim':'reason')}
  app.innerHTML=h+back();
}
function chStep(c,k){var h='<h3>'+esc(c.q)+'</h3><div>';shuf(c.opts.map(function(_,i){return i})).forEach(function(i){h+='<button class="opt" data-i="'+i+'" onclick="cpick('+i+',this)">'+esc(c.opts[i][0])+'</button><div id="cf'+i+'"></div>'});
  return h+'</div><button class="go" id="cnext" disabled onclick="cstep++;renderC()">Next</button>'}
function cpick(i,btn){var c=cstep===0?cs.claim:cs.reason;var o=c.opts[i];var cls=o[1]==='best'?'ok':(o[1]==='partial'?'part':'bad');
  btn.className='opt '+cls;document.getElementById('cf'+i).innerHTML='<div class="fb '+cls+'" role="status">'+esc(o[2])+'</div>';
  if(o[1]==='best'){tally(cs.lt,true);document.getElementById('cnext').disabled=false;document.querySelectorAll('.opt').forEach(function(b){b.onclick=null})}else{tally(cs.lt,false);btn.onclick=null}}
function evStep(){var e=cs.evid;var h='<h3>'+esc(e.q)+'</h3><div id="chk">';e.items.forEach(function(it,i){var ev=cs.evidence.filter(function(x){return x[0]===it[0]})[0];
  h+='<label class="chk"><input type="checkbox" value="'+i+'"><span><b>Evidence '+it[0]+'.</b> '+esc(ev[1])+'</span></label><div id="ef'+i+'"></div>'});
  return h+'</div><button class="go" onclick="checkEv()">Check</button><div id="evsum"></div><button class="go" id="cnext" disabled onclick="cstep++;renderC()">Next</button>'}
function checkEv(){var all=true;document.querySelectorAll('#chk input').forEach(function(inp){var i=+inp.value;var it=cs.evid.items[i];var good=(inp.checked===it[1]);if(!good)all=false;
  document.getElementById('ef'+i).innerHTML='<div class="fb '+(good?'ok':'bad')+'" role="status">'+(good?(it[1]?'Supports the claim. ':'Correctly left out. '):(it[1]?'You missed this one. ':'This one does not belong. '))+esc(it[2])+'</div>'});
  tally(cs.lt,all);
  document.getElementById('evsum').innerHTML=all?'<div class="fb ok" role="status"><b>All correct.</b></div>':'<div class="fb part" role="status">Some choices need another look. Change them and press Check again.</div>';
  if(all)document.getElementById('cnext').disabled=false}
home();
</script></body></html>
