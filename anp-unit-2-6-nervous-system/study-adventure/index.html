mbrane potential inside a resting neuron?", "c": "-70 mV", "w": ["-55 mV", "0 mV", "+30 mV"], "why": "A resting neuron is about -70 mV inside. -55 mV is the threshold."}, {"lt": "LT2", "q": "What opens at threshold and lets Na+ rush into the axon?", "c": "Voltage-gated Na+ channels", "w": ["Voltage-gated K+ channels", "Myelin sheaths", "Neurotransmitter vesicles"], "why": "Na+ channels open first at threshold. K+ channels open a little later."}, {"lt": "LT2", "q": "Which list shows the stages of an action potential in order?", "c": "Resting, depolarization, repolarization, hyperpolarization, back to resting", "w": ["Resting, repolarization, depolarization, hyperpolarization, back to resting", "Resting, hyperpolarization, depolarization, repolarization, back to resting", "Depolarization, resting, hyperpolarization, repolarization, back to resting"], "why": "Depolarization (Na+ in) comes before repolarization (K+ out)."}, {"lt": "LT2", "q": "An action potential is all or none. What does that mean?", "c": "Once threshold is reached, it always has the same size.", "w": ["It travels only in the dendrites.", "It can be half the size if the stimulus is weak.", "A stronger stimulus makes a bigger action potential."], "why": "A stronger stimulus makes more action potentials, not bigger ones."}, {"lt": "LT2", "q": "Which list shows the first three steps of a chemical synapse in order?", "c": "An action potential arrives, Ca2+ enters, vesicles release neurotransmitter", "w": ["Vesicles release neurotransmitter, Ca2+ enters, an action potential arrives", "Ca2+ enters, neurotransmitter binds receptors, an action potential arrives", "Neurotransmitter binds receptors, vesicles release, Ca2+ enters"], "why": "Calcium entry triggers the vesicles to release neurotransmitter."}, {"lt": "LT2", "q": "A drug blocks the reuptake pump. What happens in the synapse?", "c": "Neurotransmitter stays in the cleft longer.", "w": ["The action potential gets bigger.", "Less neurotransmitter is rele  in the CNS. Schwann cells make it in the PNS.", "Microglia clear debris and defend against germs."]}, {"lt": "LT2", "q": "Describe the four stages of an action potential. Say which ion moves in each stage.", "a": ["Depolarization: Na+ channels open and Na+ rushes in.", "Repolarization: K+ channels open and K+ moves out.", "Hyperpolarization: the inside dips below resting for a moment.", "Then the neuron returns to resting, about -70 mV."]}, {"lt": "LT2", "q": "Explain what 'all or none' means. How does the nervous system send a stronger signal?", "a": ["Once threshold is reached, every action potential is the same size.", "A stronger stimulus makes more action potentials per second, not bigger ones."]}, {"lt": "LT2", "q": "Describe how a signal crosses a chemical synapse. Use these words: action potential, calcium, vesicles, receptors.", "a": ["An action potential reaches the axon terminal.", "Ca2+ enters.", "Vesicles release neurotransmitter into the cleft.", "Neurotransmitter binds receptors on the next cell.", "Enzymes or reuptake clear the neurotransmitter."]}, {"lt": "LT2", "q": "How does myelin change how fast a signal travels?", "a": ["The signal jumps from node to node, so it travels faster.", "Thicker axons also carry signals faster."]}, {"lt": "LT3", "q": "Name the four lobes of the cerebrum and one job of each.", "a": ["Frontal: movement planning, reasoning, speech.", "Parietal: touch and body position.", "Temporal: hearing and memory.", "Occipital: vision."]}, {"lt": "LT3", "q": "Give the job of the cerebellum, the brain stem, and the hypothalamus.", "a": ["Cerebellum: balance and coordination.", "Brain stem: breathing, heart rate, and blood pressure.", "Hypothalamus: temperature, hunger, and thirst."]}, {"lt": "LT3", "q": "Trace a reflex arc when you touch a hot pan. Name each part.", "a": ["Receptor in the skin senses the heat.", "A sensory neuron carries the signal to the spinal cord.", "The integration center in the spinal cord processes it.", "A motor neuron carries the signal out.", "The effector (a muscle) pulls the hand away."]}, {"lt": "LT3", "q": "Explain why a spinal cord injury higher on the back affects more of the body.", "a": ["Signals pass through the spinal cord to and from the body.", "A higher injury blocks signals for more of the body below it."]}], "pairs": [{"lt": "LT1", "term": "Dendrite", "def": "Receives signals from other cells"}, {"lt": "LT1", "term": "Axon", "def": "Carries the signal away from the cell body"}, {"lt": "LT1", "term": "Myelin", "def": "Insulates the axon and speeds up the signal"}, {"lt": "LT1", "term": "Axon terminal", "def": "Releases neurotransmitter"}, {"lt": "LT1", "term": "Sensory neuron", "def": "Carries signals toward the CNS"}, {"lt": "LT1", "term": "Interneuron", "def": "Connects neurons inside the CNS"}, {"lt": "LT1", "term": "Schwann cell", "def": "Makes myelin in the PNS"}, {"lt": "LT1", "term": "Microglia", "def": "Clears debris and defends the CNS"}, {"lt": "LT2", "term": "Resting potential", "def": "About -70 mV inside the neuron"}, {"lt": "LT2", "term": "Threshold", "def": "The level that triggers an action potential, about -55 mV"}, {"lt": "LT2", "term": "Depolarization", "def": "Na+ rushes into the axon"}, {"lt": "LT2", "term": "Repolarization", "def": "K+ moves out of the axon"}, {"lt": "LT2", "term": "Synapse", "def": "The gap where one neuron signals the next cell"}, {"lt": "LT2", "term": "Reuptake", "def": "Neurotransmitter is pumped back into the sending cell"}, {"lt": "LT3", "term": "Cerebellum", "def": "Balance and smooth movement"}, {"lt": "LT3", "term": "Occipital lobe", "def": "Vision"}, {"lt": "LT3", "term": "Corpus callosum", "def": "Connects the two hemispheres"}, {"lt": "LT3", "term": "Blood-brain barrier", "def": "Controls what passes from blood into the brain"}, {"lt": "LT3", "term": "Effector", "def": "The muscle or gland that responds in a reflex"}, {"lt": "LT3", "term": "Multiple sclerosis", "def": "Immune system damages myelin in the CNS"}], "cases": [{"lt": "LT2", "title": "Numb fingers and slow signals", "intro": "A patient has numb fingers and a weak grip.", "evidence": [["A", "The patient feels little in the fingers. The hand muscles are weak but look normal in size."], ["B", "A nerve test shows signals in the arm travel at half the normal speed."], ["C", "A scan shows the myelin around the arm nerve axons is thin and patchy. The axons themselves look intact."], ["D", "The patient's resting membrane potential measured in a lab sample of the nerve cells is about -70 mV, which is normal."]], "claim": {"q": "Which claim does the evidence support?", "opts": [["Damaged myelin is slowing the signals in the arm nerves.", "best", "Correct. Slow signals and thin myelin point to a myelin problem."], ["The axons have been cut, so no signals can pass.", "bad", "Not quite. The axons look intact and signals still pass, only slower."], ["The resting potential is wrong, so the neurons cannot fire.", "bad", "Not quite. The resting potential is normal (Evidence D)."], ["The muscles are too small to work.", "bad", "Not quite. The muscles look normal in size (Evidence A)."]]}, "evid": {"q": "Pick every piece of evidence that supports the claim.", "items": [["A", true, "Numbness and weakness fit slowed or poorly carried signals."], ["B", true, "Slow signals fit a loss of the insulation that speeds them up."], ["C", true, "Thin, patchy myelin is direct evidence of the problem."], ["D", false, "A normal resting potential does not point to a myelin problem. It rules out a problem with resting conditions."]]}, "reason": {"q": "Which reasoning links the evidence to the claim?", "opts": [["Myelin insulates the axon so the signal jumps from node to node. With thin myelin the signal slows or leaks, so messages reach the hand late or weakly.", "best", "Correct. Myelin speeds the signal by letting it jump between nodes."], ["Myelin makes neurotransmitter, so thin myelin means less neurotransmitter.", "bad", "Myelin does not make neurotransmitter. Axon terminals release it."], ["Myelin insulates the axon, so thin myelin means the signal gets bigger.", "bad", "Action potentials are all or none. Thin myelin does not make them bigger."], ["Thin myelin slows the signal, which is why the muscle shrinks.", "partial", "Part is right: the signal is slowed. The muscles here look normal in size."]]}}]};
var app=document.getElementById('app');
var results={};  // lt id -> [right, tried]
D.lts.forEach(function(l){results[l.id]=[0,0]});
var used={};
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function shuf(a){a=a.slice();for(var j=a.length-1;j>0;j--){var r=Math.floor(Math.random()*(j+1));var t=a[j];a[j]=a[r];a[r]=t}return a}
function tally(lt,ok){if(!results[lt])results[lt]=[0,0];results[lt][1]++;if(ok)results[lt][0]++}
function ltName(id){var n=id;D.lts.forEach(function(l){if(l.id===id)n=l.id+': '+l.name});return n}
function home(){
  var h='<h2>Choose your study path</h2><div class="cards">'+
  '<button class="card" onclick="startQuest()"><b>1. Question Quest</b><span>Short-answer questions, like a traditional review. Write your answer, then check it.</span></button>'+
  '<button class="card" onclick="startGame()"><b>2. Streak Challenge</b><span>A game. Answer 12 questions. Build a streak. Three misses and the round ends.</span></button>'+
  '<button class="card" onclick="startMatch()"><b>3. Match-Up</b><span>Match each term to what it means. Five pairs a round.</span></button>'+
  '<button class="card" onclick="startCase()"><b>4. Prove It Case</b><span>Read a made-up case. Build a claim, pick the evidence, and explain your reasoning.</span></button>'+
  '</div><p class="note">Not sure where to start? Take the practice test in Canvas first. A miss on a learning target tells you which path to try. Come back here as often as you like.</p>'+
  planBox();
  app.innerHTML=h;window.scrollTo(0,0);
}
function planBox(){
  var any=false,rows='';
  D.lts.forEach(function(l){var r=results[l.id];if(r[1]>0)any=true;
    var pct=r[1]?Math.round(100*r[0]/r[1]):null;
    var s=pct===null?'Not tried yet':(pct>=85?'Strong':(pct>=60?'Getting there':'Needs more practice'));
    rows+='<tr><td>'+esc(l.id+': '+l.name)+'</td><td>'+(r[1]?r[0]+' of '+r[1]:'-')+'</td><td>'+s+'</td></tr>'});
  return '<div class="sum"><h3>My study plan</h3><table class="plan"><tr><th>Learning target</th><th>Right so far</th><th>Where you are</th></tr>'+rows+'</table>'+
   (any?'<p class="note">Pick a path again and work on the targets that say "Needs more practice" or "Not tried yet." This chart resets when you close the page.</p>':'<p class="note">This chart fills in as you work. It resets when you close the page.</p>')+'</div>';

function back(){return '<button class="go alt" onclick="home()">Back to the four paths</button>'}

/* ---------- 1. Question Quest ---------- */
var qi=0,ql=[];
function startQuest(){ql=shuf(D.sa);qi=0;renderQ()}
function renderQ(){
  if(qi>=ql.length){app.innerHTML='<h2>Question Quest finished</h2><p>You answered '+ql.length+' questions.</p>'+planBox()+'<button class="go" onclick="startQuest()">Do it again</button>'+back();return}
  var q=ql[qi];
  app.innerHTML='<span class="lt">Question '+(qi+1)+' of '+ql.length+' &middot; '+esc(ltName(q.lt))+'</span><h2>'+esc(q.q)+'</h2>'+
  '<textarea id="mine" aria-label="Your answer" placeholder="Write your answer here. Use full sentences."></textarea>'+
  '<div id="key"></div><button class="go" id="show" onclick="showA()">Check my answer</button>'+back();
}
function showA(){var q=ql[qi];var h='<div class="ans"><b>A strong answer includes:</b><ul>';q.a.forEach(function(x){h+='<li>'+esc(x)+'</li>'});h+='</ul></div><p><b>Compare your answer. How did you do?</b></p>'+
  '<button class="go" onclick="rate(true)">I got it</button><button class="go alt" onclick="rate(false)">Not yet</button>';
  document.getElementById('key').innerHTML=h;document.getElementById('show').disabled=true}
function rate(ok){tally(ql[qi].lt,ok);qi++;renderQ()}

/* ---------- 2. Streak Challenge ---------- */
var g;
function startGame(){var qs=shuf(D.mc).slice(0,12);g={qs:qs,i:0,streak:0,best:0,score:0,miss:0};renderG()}
function renderG(){
  if(g.i>=g.qs.length||g.miss>=3){var done=g.i>=g.qs.length;
    app.innerHTML='<h2>'+(done?'Round complete':'Round over')+'</h2><div class="stats"><div>Score: '+g.score+'</div><div>Best streak: '+g.best+'</div></div>'+
    '<p>'+(done?'You made it through all '+g.qs.length+' questions.':'Three misses ended the round. Read the feedback and try again.')+'</p>'+planBox()+'<button class="go" onclick="startGame()">Play again</button>'+back();return}
  var q=g.qs[g.i];var order=shuf([q.c].concat(q.w));g.cur=q;
  var h='<div class="stats"><div>Score: '+g.score+'</div><div>Streak: '+g.streak+'</div><div>Misses: '+g.miss+' of 3</div></div><span class="lt">Question '+(g.i+1)+' of '+g.qs.length+' &middot; '+esc(ltName(q.lt))+'</span><h2>'+esc(q.q)+'</h2><div id="opts">';
  order.forEach(function(o,i){h+='<button class="opt" data-v="'+i+'">'+esc(o)+'</button>'});
  app.innerHTML=h+'</div><div id="gfb"></div><div id="gnext"></div>'+back();
  var bs=app.querySelectorAll('.opt');bs.forEach(function(b,i){b.onclick=function(){gpick(b,order[i])}});
}
function gpick(b,val){var q=g.cur;var ok=(val===q.c);tally(q.lt,ok);
  app.querySelectorAll('.opt').forEach(function(x){x.onclick=null;if(x.textContent===q.c)x.className='opt ok'});
  if(!ok)b.className='opt bad';
  if(ok){g.streak++;g.score+=10+Math.min(g.streak-1,5)*2;if(g.streak>g.best)g.best=g.streak}else{g.streak=0;g.miss++}
  document.getElementById('gfb').innerHTML='<div class="fb '+(ok?'ok':'bad')+'" role="status"><b>'+(ok?'Correct. ':'Not quite. ')+'</b>'+esc(q.why)+'</div>';
  document.getElementById('gnext').innerHTML='<button class="go" onclick="g.i++;renderG()">Next</button>'}

/* ---------- 3. Match-Up ---------- */
var m;
function startMatch(){m={all:shuf(D.pairs),round:0,selT:null,selD:null,wrong:0};renderM()}
function renderM(){
  var start=m.round*5,set=m.all.slice(start,start+5);
  if(!set.length){app.innerHTML='<h2>Match-Up finished</h2><p>You matched every pair.</p>'+planBox()+'<button class="go" onclick="startMatch()">Play again</button>'+back();return}
  m.set=set;m.left=set.length;m.terms=shuf(set.map(function(_,i){return i}));m.defs=shuf(set.map(function(_,i){return i}));m.selT=m.selD=null;
  var h='<span class="lt">Round '+(m.round+1)+' of '+Math.ceil(m.all.length/5)+'</span><h2>Match each term to what it means</h2><p class="note">Pick a term on the left, then pick its match on the right.</p><div class="match"><div id="mt"></div><div id="md"></div></div><div id="mfb"></div>'+back();
  app.innerHTML=h;
  var mt=document.getElementById('mt'),md=document.getElementById('md');
  m.terms.forEach(function(i){var b=document.createElement('button');b.className='m';b.textContent=set[i].term;b.dataset.i=i;b.onclick=function(){mpick('t',i,b)};mt.appendChild(b)});
  m.defs.forEach(function(i){var b=document.createElement('button');b.className='m';b.textContent=set[i].def;b.dataset.i=i;b.onclick=function(){mpick('d',i,b)};md.appendChild(b)});
}
function mpick(side,i,b){if(b.classList.contains('gone'))return;
  var box=document.getElementById(side==='t'?'mt':'md');box.querySelectorAll('.m').forEach(function(x){x.classList.remove('sel')});b.classList.add('sel');
  if(side==='t')m.selT=[i,b];else m.selD=[i,b];
  if(m.selT&&m.selD){var a=m.selT,c=m.selD;var ok=(a[0]===c[0]);tally(m.set[a[0]].lt,ok);
    if(ok){[a[1],c[1]].forEach(function(x){x.className='m gone'});m.left--;document.getElementById('mfb').innerHTML='<div class="fb ok" role="status">Correct match.</div>';
      if(!m.left){document.getElementById('mfb').innerHTML+='<button class="go" onclick="m.round++;renderM()">Next round</button>'}}
    else{[a[1],c[1]].forEach(function(x){x.className='m wrong'});document.getElementById('mfb').innerHTML='<div class="fb bad" role="status">Not a match. Try again.</div>';
      setTimeout(function(){[a[1],c[1]].forEach(function(x){if(!x.classList.contains('gone'))x.className='m'})},700)}
    m.selT=m.selD=null}}

/* ---------- 4. Prove It Case ---------- */
var cs,cstep;
function startCase(){cs=D.cases[Math.floor(Math.random()*D.cases.length)];cstep=0;renderC()}
function renderC(){
  var h='<h2>'+esc(cs.title)+'</h2><p>'+esc(cs.intro)+' <i>This case is made up for practice.</i></p><div class="ev">';
  cs.evidence.forEach(function(e){h+='<p><b>Evidence '+e[0]+'.</b> '+esc(e[1])+'</p>'});h+='</div>';
  h+='<div class="bar">';for(var i=0;i<3;i++)h+='<span class="'+(i<cstep?'done':(i===cstep?'on':''))+'"></span>';h+='</div>';
  if(cstep===3){app.innerHTML='<h2>'+esc(cs.title)+': done</h2><div class="sum"><p><b>Claim:</b> '+esc(cs.claim.opts[0][0])+'</p><p><b>Reasoning:</b> '+esc(cs.reason.opts[0][0])+'</p></div>'+planBox()+'<button class="go" onclick="startCase()">Try another case</button>'+back();return}
  if(cstep===1){h+=evStep()}else{h+=chStep(cstep===0?cs.claim:cs.reason,cstep===0?'claim':'reason')}
  app.innerHTML=h+back();
}
function chStep(c,k){var h='<h3>'+esc(c.q)+'</h3><div>';shuf(c.opts.map(function(_,i){return i})).forEach(function(i){h+='<button class="opt" data-i="'+i+'" onclick="cpick('+i+',this)">'+esc(c.opts[i][0])+'</button><div id="cf'+i+'"></div>'});
  return h+'</div><button class="go" id="cnext" disabled onclick="cstep++;renderC()">Next</button>'}
function cpick(i,btn){var c=cstep===0?cs.claim:cs.reason;var o=c.opts[i];var cls=o[1]==='best'?'ok':(o[1]==='partial'?'part':'bad');
  btn.className='opt '+cls;document.getElementById('cf'+i).innerHTML='<div class="fb '+cls+'" role="status">'+esc(o[2])+'</div>';
  if(o[1]==='best'){tally(cs.lt,true);document.getElementById('cnext').disabled=false;document.querySelectorAll('.opt').forEach(function(b){b.onclick=null})}else{tally(cs.lt,false);btn.onclick=null}}
function evStep(){var e=cs.evid;var h='<h3>'+esc(e.q)+'</h3><div id="chk">';e.items.forEach(function(it,i){var ev=cs.evidence.filter(function(x){return x[0]===it[0]})[0];
  h+='<label class="chk"><input type="checkbox" value="'+i+'"><span><b>Evidence '+it[0]+'.</b> '+esc(ev[1])+'</span></label><div id="ef'+i+'"></div>'});
  return h+'</div><button class="go" onclick="checkEv()">Check</button><div id="evsum"></div><button class="go" id="cnext" disabled onclick="cstep++;renderC()">Next</button>'}
function checkEv(){var all=true;document.querySelectorAll('#chk input').forEach(function(inp){var i=+inp.value;var it=cs.evid.items[i];var good=(inp.checked===it[1]);if(!good)all=false;
  document.getElementById('ef'+i).innerHTML='<div class="fb '+(good?'ok':'bad')+'" role="status">'+(good?(it[1]?'Supports the claim. ':'Correctly left out. '):(it[1]?'You missed this one. ':'This one does not belong. '))+esc(it[2])+'</div>'});
  tally(cs.lt,all);
  document.getElementById('evsum').innerHTML=all?'<div class="fb ok" role="status"><b>All correct.</b></div>':'<div class="fb part" role="status">Some choices need another look. Change them and press Check again.</div>';
  if(all)document.getElementById('cnext').disabled=false}
home();
</script></body></html>
