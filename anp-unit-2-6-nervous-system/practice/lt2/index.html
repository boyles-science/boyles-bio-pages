<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice: Action Potentials and Synapses</title>
<style>
:root{--ink:#161821;--bg:#fff;--blue:#2b50c8;--ok:#1b6e2f;--okbg:#e6f4ea;--bad:#a12a1a;--badbg:#fdeceb;--part:#7a5a00;--partbg:#fff4d6}
*{box-sizing:border-box}body{margin:0;font:18px/1.45 Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg)}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:4px 0 2px}h2{font-size:21px;margin:18px 0 6px}
.tag{display:inline-block;background:var(--blue);color:#fff;border-radius:6px;padding:2px 10px;font-size:15px;font-weight:700;letter-spacing:.04em}
.note{color:#444;font-size:16px}
.ev{border:1.5px solid #bbb;border-radius:8px;padding:10px 14px;margin:10px 0}
.ev p{margin:6px 0}.ev b{color:var(--blue)}
.opt{display:block;width:100%;text-align:left;font:inherit;background:#fff;border:2px solid #9aa3b8;border-radius:8px;padding:10px 12px;margin:8px 0;cursor:pointer}
.opt:hover{border-color:var(--blue)}
.fb{margin:6px 0 2px;padding:8px 12px;border-radius:8px;font-size:17px}
.ok{background:var(--okbg);border:2px solid var(--ok)}.bad{background:var(--badbg);border:2px solid var(--bad)}.part{background:var(--partbg);border:2px solid var(--part)}
.opt.ok,.opt.bad,.opt.part{cursor:default}
label.chk{display:flex;gap:10px;align-items:flex-start;border:2px solid #9aa3b8;border-radius:8px;padding:10px 12px;margin:8px 0}
label.chk input{width:22px;height:22px;margin-top:3px}
button.go{font:inherit;font-weight:700;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 18px;margin:10px 0;cursor:pointer}
button.go:disabled{background:#aab;cursor:not-allowed}
.steps{display:flex;gap:6px;margin:10px 0}.steps span{flex:1;height:8px;border-radius:4px;background:#d5d9e6}.steps span.on{background:var(--blue)}.steps span.done{background:var(--ok)}
.sum{border:2px solid var(--blue);border-radius:10px;padding:12px 16px;margin:12px 0}
a{color:var(--blue)}
</style></head><body><div class="wrap">
<span class="tag" id="mode"></span>
<h1>Practice: Action Potentials and Synapses</h1>
<p class="note">Read the case. Then build a claim, evidence, and reasoning. You get feedback right away. Cases are made up for practice.</p>
<div id="app"></div>
<p class="note" id="switch"></p>
</div>
<script>
var DATA={"support": [{"title": "A numbing medicine", "intro": "A dentist uses a medicine that numbs a tooth. This case is made up for practice.", "evidence": [["A", "The medicine blocks the Na+ channels in the axons of sensory neurons."], ["B", "The resting potential of those neurons stays at -70 mV."], ["C", "The patient feels no pain, but touch and pressure may still be felt."], ["D", "The medicine wears off after about an hour."]], "claim": {"q": "Step 1. Which step of the signal does the medicine stop?", "opts": [["Depolarization, so no action potential forms", "best", "Yes. Without Na+ entering, the membrane does not reach threshold."], ["The resting potential", "wrong", "Not this one. Evidence B says the resting potential stays at -70 mV."], ["Release of neurotransmitter from muscles", "wrong", "Not this one. The medicine works on sensory axons, not at a muscle synapse."], ["Repolarization", "wrong", "Not this one. Repolarization happens after depolarization. If there is no depolarization, it does not start."]]}, "evid": {"q": "Step 2. Which pieces of evidence support the claim? Select all that apply. Then press Check.", "items": [["A", true, "Yes. Na+ channels are what open for depolarization."], ["B", true, "Yes. The neuron is normal at rest, so the problem is in firing."], ["C", true, "Yes. No pain signal reaches the brain."], ["D", false, "This does not support the claim. It tells you how long the effect lasts, not which step is blocked."]]}, "reason": {"q": "Step 3. Which reasoning connects the evidence to the claim?", "opts": [["Na+ must enter to reach threshold and start an action potential. With Na+ channels blocked, no action potential forms, so no pain signal reaches the brain.", "best", "Yes. It links the channel to the stage of the action potential and to the body's response."], ["K+ must enter to reach threshold. With K+ blocked, no signal forms.", "wrong", "Not quite. Na+ enters to depolarize the membrane. K+ leaves later."], ["The medicine makes the myelin thicker, which slows the signal.", "wrong", "Not quite. The evidence says the Na+ channels are blocked, not that myelin changes."]]}}, {"title": "A blocked receptor", "intro": "A toxin acts at a synapse between a neuron and a muscle fiber. This case is made up for practice.", "evidence": [["A", "The motor neuron releases the usual amount of neurotransmitter."], ["B", "Calcium enters the axon terminal normally."], ["C", "The toxin attaches to the receptors on the muscle fiber."], ["D", "The muscle fiber does not contract."]], "claim": {"q": "Step 1. Which step of the synapse is blocked?", "opts": [["Neurotransmitter binding to receptors", "best", "Yes. The toxin is on the receptors."], ["Calcium entering the terminal", "wrong", "Not this one. Evidence B says calcium enters normally."], ["Release of neurotransmitter", "wrong", "Not this one. Evidence A says release is normal."], ["Reuptake of neurotransmitter", "wrong", "Not this one. Nothing in the evidence shows reuptake changed."]]}, "evid": {"q": "Step 2. Which pieces of evidence support the claim? Select all that apply. Then press Check.", "items": [["A", true, "Yes. Release is normal, so the problem is after release."], ["B", true, "Yes. Calcium entry is normal, so the earlier steps work."], ["C", true, "Yes. This shows where the toxin acts."], ["D", true, "Yes. This is the result when the signal cannot be received."]]}, "reason": {"q": "Step 3. Which reasoning connects the evidence to the claim?", "opts": [["Neurotransmitter is released but cannot bind to the blocked receptors. The muscle fiber does not get the signal, so it does not contract.", "best", "Yes. It follows the signal through the synapse."], ["Neurotransmitter is not released, so the muscle fiber does not get the signal.", "wrong", "Not quite. Evidence A says release is normal."], ["The muscle fiber has too much calcium, so it cannot contract.", "wrong", "Not quite. The evidence is about the receptors, not calcium in the muscle fiber."]]}}], "stretch": [{"title": "Which axon is fastest?", "intro": "A scientist measures how fast signals travel in four axons. These are sample results, made up for practice.", "evidence": [["A", "Axon 1: thick, with myelin. 70 meters per second."], ["B", "Axon 2: thin, with myelin. 15 meters per second."], ["C", "Axon 3: thin, without myelin. 1 meter per second."], ["D", "Axon 4: thick, without myelin. 5 meters per second."], ["E", "All four axons use the same ions and the same channels."]], "claim": {"q": "Step 1. Which claim is best supported?", "opts": [["Myelin and a larger diameter both make signals faster.", "best", "Yes. Compare the axons in pairs to see each effect."], ["Only a larger diameter makes signals faster.", "partial", "Partly right. A larger diameter helps, but compare thin myelinated (15) with thin unmyelinated (1) to see that myelin helps too."], ["Only myelin makes signals faster.", "partial", "Partly right. Myelin helps, but compare thick unmyelinated (5) with thin unmyelinated (1) to see that diameter helps too."], ["Neither one changes the speed.", "wrong", "Not this one. The speeds differ a lot."]]}, "evid": {"q": "Step 2. Which pieces of evidence support the claim? Select all that apply. Then press Check.", "items": [["A", true, "Yes. Thick and myelinated is fastest."], ["B", true, "Yes. Compared with Axon 3, myelin raises the speed from 1 to 15."], ["C", true, "Yes. It is the baseline: thin and unmyelinated."], ["D", true, "Yes. Compared with Axon 3, a larger diameter raises the speed from 1 to 5."], ["E", false, "This does not support the claim. Same ions and channels means the difference is not caused by the ions."]]}, "reason": {"q": "Step 3. Which reasoning connects the evidence to the claim?", "opts": [["Myelin makes the action potential jump from node to node. A larger diameter lets ions move with less resistance. Both raise the speed.", "best", "Yes. It explains each effect."], ["Myelin makes the action potential bigger, so it moves faster.", "wrong", "Not quite. Action potentials are all or none. Myelin changes how the signal travels, not its size."], ["A larger diameter gives the axon more neurotransmitter, so it moves faster.", "wrong", "Not quite. Neurotransmitter is released at the axon terminals. It does not change the speed along the axon."]]}, "extra": {"q": "Step 4. Predict. A disease damages the myelin on axon 1. What happens to its speed?", "opts": [["It falls, probably toward the speed of a thick axon without myelin (about 5).", "best", "Yes. Losing myelin removes the jump from node to node."], ["It rises, because the axon is thicker.", "wrong", "Not quite. Losing myelin removes the main speed-up."], ["It stays at 70, because the diameter is the same.", "wrong", "Not quite. Diameter is one factor, but myelin is another."]]}}]};
var q=new URLSearchParams(location.search);var mode=(q.get('mode')==='stretch')?'stretch':'support';
var list=DATA[mode];var si=0,step=0,miss=[0,0,0,0];var app=document.getElementById('app');
document.getElementById('mode').textContent=(mode==='stretch'?'Stretch':'Support')+' practice';
document.getElementById('switch').innerHTML=mode==='stretch'?'Want more guidance? <a href="?mode=support">Open the Support page</a>.':'Ready for a harder case? <a href="?mode=stretch">Open the Stretch page</a>.';
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function stepsBar(n,cur){var h='<div class="steps" aria-hidden="true">';for(var i=0;i<n;i++)h+='<span class="'+(i<cur?'done':(i===cur?'on':''))+'"></span>';return h+'</div>'}
function render(){var s=list[si];var h='<h2>Case '+(si+1)+' of '+list.length+': '+esc(s.title)+'</h2><p>'+esc(s.intro)+'</p><div class="ev">';
 s.evidence.forEach(function(e){h+='<p><b>Evidence '+e[0]+'.</b> '+esc(e[1])+'</p>'});h+='</div>';
 var n=s.extra?4:3;h+=stepsBar(n,step);
 var kinds=['claim','evid','reason','extra'];var k=kinds[step];
 if(k==='evid'){h+=evidStep(s)}else{h+=choiceStep(s[k],k)}
 app.innerHTML=h;}
function shuf(n){var a=[];for(var i=0;i<n;i++)a.push(i);for(var j=n-1;j>0;j--){var r=Math.floor(Math.random()*(j+1));var t=a[j];a[j]=a[r];a[r]=t}return a}
function choiceStep(c,k){var h='<h2>'+esc(c.q)+'</h2><div id="opts">';shuf(c.opts.length).forEach(function(i){var o=c.opts[i];h+='<button class="opt" data-i="'+i+'" onclick="pick(\''+k+'\','+i+')">'+esc(o[0])+'</button><div id="fb'+i+'"></div>'});return h+'</div><button class="go" id="next" disabled onclick="nextStep()">Next</button>'}
function pick(k,i){var s=list[si];var c=s[k];var o=c.opts[i];var cls=o[1]==='best'?'ok':(o[1]==='partial'?'part':'bad');
 var btn=document.querySelector('.opt[data-i="'+i+'"]');btn.className='opt '+cls;
 document.getElementById('fb'+i).innerHTML='<div class="fb '+cls+'" role="status">'+esc(o[2])+'</div>';
 if(o[1]==='best'){document.getElementById('next').disabled=false;document.querySelectorAll('.opt').forEach(function(b){b.onclick=null})}
 else{miss[step]++;btn.onclick=null}}
function evidStep(s){var e=s.evid;var h='<h2>'+esc(e.q)+'</h2><div id="chk">';e.items.forEach(function(it,i){var ev=s.evidence.filter(function(x){return x[0]===it[0]})[0];h+='<label class="chk"><input type="checkbox" value="'+i+'"><span><b>Evidence '+it[0]+'.</b> '+esc(ev[1])+'</span></label><div id="ef'+i+'"></div>'});
 return h+'</div><button class="go" onclick="checkEvid()">Check</button><div id="evsum"></div><button class="go" id="next" disabled onclick="nextStep()">Next</button>'}
function checkEvid(){var s=list[si];var e=s.evid;var allok=true;
 document.querySelectorAll('#chk input').forEach(function(inp){var i=+inp.value;var it=e.items[i];var on=inp.checked;var good=(on===it[1]);if(!good)allok=false;
  var cls=good?'ok':'bad';var msg=good?(it[1]?'Supports the claim. ':'Correctly left out. '):(it[1]?'You missed this one. ':'This one does not belong. ');
  document.getElementById('ef'+i).innerHTML='<div class="fb '+cls+'" role="status">'+msg+esc(it[2])+'</div>'});
 var sum=document.getElementById('evsum');
 if(allok){sum.innerHTML='<div class="fb ok" role="status"><b>All correct.</b></div>';document.getElementById('next').disabled=false}
 else{miss[step]++;sum.innerHTML='<div class="fb bad" role="status"><b>Not yet.</b> Read the feedback above, change your choices, and press Check again.</div>'}}
function nextStep(){var s=list[si];var n=s.extra?4:3;step++;if(step>=n){summary();return}render();window.scrollTo(0,0)}
function summary(){var s=list[si];var n=s.extra?4:3;var first=0;for(var i=0;i<n;i++)if(miss[i]===0)first++;
 var h='<h2>Case '+(si+1)+' done: '+esc(s.title)+'</h2><div class="sum"><p><b>You got '+first+' of '+n+' steps right on the first try.</b></p>';
 h+='<p>'+(first===n?'Strong work.':(first>=n-1?'Almost there. Review the step you missed.':'Go back over the lesson notes, then try the next case.'))+'</p></div>';
 if(si+1<list.length){h+='<button class="go" onclick="again()">Next case</button>'}else{h+='<p>That was the last case on this page.</p><p><button class="go" onclick="location.reload()">Start over</button></p>'}
 app.innerHTML=h;window.scrollTo(0,0)}
function again(){si++;step=0;miss=[0,0,0,0];render();window.scrollTo(0,0)}
render();
</script></body></html>
