<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice: The Brain</title>
<style>
:root{--ink:#161821;--bg:#fff;--blue:#2b50c8;--ok:#1b6e2f;--okbg:#e6f4ea;--bad:#a12a1a;--badbg:#fdeceb;--part:#7a5a00;--partbg:#fff4d6}
*{box-sizing:border-box}body{margin:0;font:18px/1.45 Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg)}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:4px 0 2px}h2{font-size:21px;margin:18px 0 6px}
.tag{display:inline-block;background:var(--blue);color:#fff;border-radius:6px;padding:2px 10px;font-size:15px;font-weight:700;letter-spacing:.04em}
.note{color:#444;font-size:16px}
.ev{border:1.5px solid #bbb;border-radius:8px;padding:10px 14px;margin:10px 0}
.ev p{margin:6px 0}.ev b{color:var(--blue)}
.opt{display:block;width:100%;text-align:left;font:inherit;background:#fff;border:2px solid #9aa3b8;border-radius:8px;padding:10px 12px;margin:8px 0;cursor:pointer}
.opt:hover{border-color:var(--blue)}
.fb{margin:6px 0 2px;padding:8px 12px;border-radius:8px;font-size:17px}
.ok{background:var(--okbg);border:2px solid var(--ok)}.bad{background:var(--badbg);border:2px solid var(--bad)}.part{background:var(--partbg);border:2px solid var(--part)}
.opt.ok,.opt.bad,.opt.part{cursor:default}
label.chk{display:flex;gap:10px;align-items:flex-start;border:2px solid #9aa3b8;border-radius:8px;padding:10px 12px;margin:8px 0}
label.chk input{width:22px;height:22px;margin-top:3px}
button.go{font:inherit;font-weight:700;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 18px;margin:10px 0;cursor:pointer}
button.go:disabled{background:#aab;cursor:not-allowed}
.steps{display:flex;gap:6px;margin:10px 0}.steps span{flex:1;height:8px;border-radius:4px;background:#d5d9e6}.steps span.on{background:var(--blue)}.steps span.done{background:var(--ok)}
.sum{border:2px solid var(--blue);border-radius:10px;padding:12px 16px;margin:12px 0}
a{color:var(--blue)}
</style></head><body><div class="wrap">
<span class="tag" id="mode"></span>
<h1>Practice: The Brain</h1>
<p class="note">Read the case. Then build a claim, evidence, and reasoning. You get feedback right away. Cases are made up for practice.</p>
<div id="app"></div>
<p class="note" id="switch"></p>
</div>
<script>
var DATA={"support": [{"title": "Trouble with balance", "intro": "A patient has trouble with balance after a fall. This case is made up for practice.", "evidence": [["A", "The patient sways when standing with the feet together."], ["B", "The patient misses the nose when trying to touch it with a finger."], ["C", "The patient speaks clearly and understands speech."], ["D", "A scan shows injury to the lower back part of the brain."]], "claim": {"q": "Step 1. Which part of the brain is most likely injured?", "opts": [["The cerebellum", "best", "Yes. The cerebellum coordinates balance and smooth movement."], ["The frontal lobe", "wrong", "Not this one. Speech and understanding are normal, and the frontal lobe handles planning and speech."], ["The occipital lobe", "wrong", "Not this one. The occipital lobe handles vision."], ["The medulla", "wrong", "Not this one. The medulla controls breathing and heart rate."]]}, "evid": {"q": "Step 2. Which pieces of evidence support the claim? Select all that apply. Then press Check.", "items": [["A", true, "Yes. Poor balance is a cerebellum sign."], ["B", true, "Yes. Poor coordination is a cerebellum sign."], ["C", false, "This does not support the claim. It rules out a speech problem but does not show a cerebellum problem."], ["D", true, "Yes. The cerebellum is in the lower back part of the brain."]]}, "reason": {"q": "Step 3. Which reasoning connects the evidence to the claim?", "opts": [["The cerebellum coordinates balance and smooth movement. Injury there causes swaying and missed movements, and the scan shows injury where the cerebellum is.", "best", "Yes. It links the region's job to the signs."], ["The cerebellum controls speech. Injury there causes swaying.", "wrong", "Not quite. Speech is mainly the frontal lobe. The cerebellum handles balance."], ["The cerebellum controls vision. Injury there causes missed movements.", "wrong", "Not quite. Vision is mainly the occipital lobe."]]}}, {"title": "Loss of vision", "intro": "A person loses part of their vision after a blow to the back of the head. This case is made up for practice.", "evidence": [["A", "The person cannot see parts of the visual field."], ["B", "An eye exam shows the eyes and optic nerves are healthy."], ["C", "A scan shows injury at the back of the head, in the cerebral cortex."], ["D", "Hearing, touch, and movement are normal."]], "claim": {"q": "Step 1. Which lobe is most likely injured?", "opts": [["The occipital lobe", "best", "Yes. The occipital lobe processes signals from the eyes."], ["The temporal lobe", "partial", "Partly right. The temporal lobe is near the sides and handles hearing and memory, not vision."], ["The parietal lobe", "wrong", "Not this one. The parietal lobe handles touch and body position."], ["The frontal lobe", "wrong", "Not this one. The frontal lobe handles planning, reasoning, and speech."]]}, "evid": {"q": "Step 2. Which pieces of evidence support the claim? Select all that apply. Then press Check.", "items": [["A", true, "Yes. The problem is with vision."], ["B", true, "Yes. The eyes and optic nerves work, so the problem is in the brain."], ["C", true, "Yes. The occipital lobe is at the back of the cerebrum."], ["D", true, "Yes. Other senses work, so other lobes are probably fine."]]}, "reason": {"q": "Step 3. Which reasoning connects the evidence to the claim?", "opts": [["The occipital lobe processes signals from the eyes. The eyes work, but the occipital lobe is injured, so the brain cannot make the image.", "best", "Yes. It uses the lobe's job and rules out the eyes."], ["The occipital lobe controls hearing. Injury there causes vision loss.", "wrong", "Not quite. Hearing is mainly the temporal lobe."], ["The eyes are damaged, so the signal is never sent.", "wrong", "Not quite. Evidence B says the eyes work."]]}}], "stretch": [{"title": "Slow breathing after a head injury", "intro": "A patient has a head injury. This case is made up for practice.", "evidence": [["A", "The patient breathes slowly and the heart rate is low."], ["B", "A scan shows swelling pressing on the brain stem."], ["C", "The patient has a headache."], ["D", "The patient is sleepy, but can answer simple questions."], ["E", "The patient's arms and legs move normally."]], "claim": {"q": "Step 1. Which part of the brain is most likely affected?", "opts": [["The medulla in the brain stem", "best", "Yes. The medulla controls breathing and heart rate."], ["The cerebellum", "wrong", "Not this one. The cerebellum coordinates balance and smooth movement."], ["The temporal lobe", "wrong", "Not this one. The temporal lobe handles hearing and memory."], ["The corpus callosum", "wrong", "Not this one. It connects the two hemispheres."]]}, "evid": {"q": "Step 2. Which pieces of evidence support the claim? Select all that apply. Then press Check.", "items": [["A", true, "Yes. Breathing and heart rate are controlled by the medulla."], ["B", true, "Yes. The scan shows the area involved."], ["C", false, "This does not support the claim. A headache could come from many causes."], ["D", false, "This is not specific. Sleepiness does not point to the medulla alone."], ["E", false, "This does not support the claim. Normal movement does not show a brain stem problem."]]}, "reason": {"q": "Step 3. Which reasoning connects the evidence to the claim?", "opts": [["The medulla sends signals that set the breathing rate and the heart rate. Pressure on the brain stem slows these signals, so breathing and heart rate fall.", "best", "Yes. It links the region's job to the signs."], ["The medulla coordinates balance. Pressure on it slows the heart.", "wrong", "Not quite. Balance is the cerebellum."], ["The brain stem plans movement. Pressure on it slows breathing.", "wrong", "Not quite. Movement planning is the frontal lobe."]]}, "extra": {"q": "Step 4. Predict. Why is swelling near the brain stem an emergency?", "opts": [["The brain stem controls breathing and heart rate, which the body needs to stay alive.", "best", "Yes. These automatic jobs cannot stop."], ["The brain stem controls hearing, which is needed for balance.", "wrong", "Not quite. Hearing is mainly the temporal lobe."], ["The brain stem makes myelin for the whole brain.", "wrong", "Not quite. Oligodendrocytes make myelin in the CNS."]]}}]};
var q=new URLSearchParams(location.search);var mode=(q.get('mode')==='stretch')?'stretch':'support';
var list=DATA[mode];var si=0,step=0,miss=[0,0,0,0];var app=document.getElementById('app');
document.getElementById('mode').textContent=(mode==='stretch'?'Stretch':'Support')+' practice';
document.getElementById('switch').innerHTML=mode==='stretch'?'Want more guidance? <a href="?mode=support">Open the Support page</a>.':'Ready for a harder case? <a href="?mode=stretch">Open the Stretch page</a>.';
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function stepsBar(n,cur){var h='<div class="steps" aria-hidden="true">';for(var i=0;i<n;i++)h+='<span class="'+(i<cur?'done':(i===cur?'on':''))+'"></span>';return h+'</div>'}
function render(){var s=list[si];var h='<h2>Case '+(si+1)+' of '+list.length+': '+esc(s.title)+'</h2><p>'+esc(s.intro)+'</p><div class="ev">';
 s.evidence.forEach(function(e){h+='<p><b>Evidence '+e[0]+'.</b> '+esc(e[1])+'</p>'});h+='</div>';
 var n=s.extra?4:3;h+=stepsBar(n,step);
 var kinds=['claim','evid','reason','extra'];var k=kinds[step];
 if(k==='evid'){h+=evidStep(s)}else{h+=choiceStep(s[k],k)}
 app.innerHTML=h;}
function shuf(n){var a=[];for(var i=0;i<n;i++)a.push(i);for(var j=n-1;j>0;j--){var r=Math.floor(Math.random()*(j+1));var t=a[j];a[j]=a[r];a[r]=t}return a}
function choiceStep(c,k){var h='<h2>'+esc(c.q)+'</h2><div id="opts">';shuf(c.opts.length).forEach(function(i){var o=c.opts[i];h+='<button class="opt" data-i="'+i+'" onclick="pick(\''+k+'\','+i+')">'+esc(o[0])+'</button><div id="fb'+i+'"></div>'});return h+'</div><button class="go" id="next" disabled onclick="nextStep()">Next</button>'}
function pick(k,i){var s=list[si];var c=s[k];var o=c.opts[i];var cls=o[1]==='best'?'ok':(o[1]==='partial'?'part':'bad');
 var btn=document.querySelector('.opt[data-i="'+i+'"]');btn.className='opt '+cls;
 document.getElementById('fb'+i).innerHTML='<div class="fb '+cls+'" role="status">'+esc(o[2])+'</div>';
 if(o[1]==='best'){document.getElementById('next').disabled=false;document.querySelectorAll('.opt').forEach(function(b){b.onclick=null})}
 else{miss[step]++;btn.onclick=null}}
function evidStep(s){var e=s.evid;var h='<h2>'+esc(e.q)+'</h2><div id="chk">';e.items.forEach(function(it,i){var ev=s.evidence.filter(function(x){return x[0]===it[0]})[0];h+='<label class="chk"><input type="checkbox" value="'+i+'"><span><b>Evidence '+it[0]+'.</b> '+esc(ev[1])+'</span></label><div id="ef'+i+'"></div>'});
 return h+'</div><button class="go" onclick="checkEvid()">Check</button><div id="evsum"></div><button class="go" id="next" disabled onclick="nextStep()">Next</button>'}
function checkEvid(){var s=list[si];var e=s.evid;var allok=true;
 document.querySelectorAll('#chk input').forEach(function(inp){var i=+inp.value;var it=e.items[i];var on=inp.checked;var good=(on===it[1]);if(!good)allok=false;
  var cls=good?'ok':'bad';var msg=good?(it[1]?'Supports the claim. ':'Correctly left out. '):(it[1]?'You missed this one. ':'This one does not belong. ');
  document.getElementById('ef'+i).innerHTML='<div class="fb '+cls+'" role="status">'+msg+esc(it[2])+'</div>'});
 var sum=document.getElementById('evsum');
 if(allok){sum.innerHTML='<div class="fb ok" role="status"><b>All correct.</b></div>';document.getElementById('next').disabled=false}
 else{miss[step]++;sum.innerHTML='<div class="fb bad" role="status"><b>Not yet.</b> Read the feedback above, change your choices, and press Check again.</div>'}}
function nextStep(){var s=list[si];var n=s.extra?4:3;step++;if(step>=n){summary();return}render();window.scrollTo(0,0)}
function summary(){var s=list[si];var n=s.extra?4:3;var first=0;for(var i=0;i<n;i++)if(miss[i]===0)first++;
 var h='<h2>Case '+(si+1)+' done: '+esc(s.title)+'</h2><div class="sum"><p><b>You got '+first+' of '+n+' steps right on the first try.</b></p>';
 h+='<p>'+(first===n?'Strong work.':(first>=n-1?'Almost there. Review the step you missed.':'Go back over the lesson notes, then try the next case.'))+'</p></div>';
 if(si+1<list.length){h+='<button class="go" onclick="again()">Next case</button>'}else{h+='<p>That was the last case on this page.</p><p><button class="go" onclick="location.reload()">Start over</button></p>'}
 app.innerHTML=h;window.scrollTo(0,0)}
function again(){si++;step=0;miss=[0,0,0,0];render();window.scrollTo(0,0)}
render();
</script></body></html>
