<html lang="en">
<head>

<title>LT3 Stretch: Energy, strength, and fiber types</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--muted:#555;--line:#8a8a8a;--card:#f4f4f4;--ok-bg:#e3f2e6;--ok-bd:#1d6b2f;--bad-bg:#fbe9e7;--bad-bd:#a3281c;--sel:#dbe8fb;--sel-bd:#1f4e9c;--hint-bg:#fff6d6;}
@media (prefers-color-scheme:dark){:root{--bg:#16181c;--fg:#eee;--muted:#b5b5b5;--line:#777;--card:#23262c;--ok-bg:#16301d;--ok-bd:#6fcf86;--bad-bg:#3a1c18;--bad-bd:#ff9a8d;--sel:#1b2f4f;--sel-bd:#8db7ff;--hint-bg:#3a3414;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
main{max-width:740px;margin:0 auto;padding:16px}
small,.muted{color:var(--muted)}
h1{font-size:1.5rem;margin:.2rem 0 .4rem}
h2{font-size:1.25rem;margin:1.2rem 0 .4rem}
.course{font-size:.85rem;color:var(--muted)}
.how{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 14px;margin:10px 0}
.how ol{margin:.3rem 0 .3rem 1.2rem;padding:0}
.dots{display:flex;gap:8px;margin:12px 0}
.dot{padding:2px 10px;border:2px solid var(--line);border-radius:14px;font-size:.85rem}
.dot.now{border-color:var(--sel-bd);background:var(--sel);font-weight:700}
.dot.done{border-color:var(--ok-bd)}
table{border-collapse:collapse;width:100%;margin:8px 0}
caption{text-align:left;font-size:.85rem;color:var(--muted);padding:4px 0}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;font-size:.95rem}
th{background:var(--card)}
.q{font-weight:700;margin:14px 0 6px}
.hint{background:var(--hint-bg);border-left:5px solid var(--line);padding:6px 10px;margin:8px 0;font-size:.95rem}
.opts{display:grid;gap:8px;margin:8px 0}
button.opt,button.card{display:block;width:100%;text-align:left;min-height:44px;padding:10px 12px;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:8px;cursor:pointer}
button.opt:focus-visible,button.card:focus-visible,button.go:focus-visible{outline:3px solid var(--sel-bd);outline-offset:2px}
button.card[aria-pressed="true"]{background:var(--sel);border-color:var(--sel-bd)}
button.card[aria-pressed="true"]::before{content:"\2713  "}
.good{background:var(--ok-bg)!important;border-color:var(--ok-bd)!important}
.bad{background:var(--bad-bg)!important;border-color:var(--bad-bd)!important}
.why{display:block;font-size:.92rem;margin-top:4px}
.msg{margin:8px 0;padding:8px 12px;border-radius:8px;border:2px solid var(--line)}
.msg.good{border-color:var(--ok-bd)}.msg.bad{border-color:var(--bad-bd)}
button.go{font:inherit;font-weight:700;min-height:44px;padding:8px 18px;margin:8px 8px 8px 0;border:2px solid var(--fg);border-radius:8px;background:var(--fg);color:var(--bg);cursor:pointer}
button.go[disabled]{opacity:.45;cursor:not-allowed}
.cer{border:2px solid var(--fg);border-radius:8px;padding:6px 14px;margin:10px 0}
.cer h3{margin:.5rem 0 .1rem;font-size:1rem}
.cer ul{margin:.2rem 0 .2rem 1.2rem;padding:0}
textarea.fallback{width:100%;min-height:8rem;font:inherit}
</style>
</head>

<script>
window.CER_LT = 3;
window.CER_DATA = {"3":{"id":"LT3","title":"Energy, strength, and fiber types","target":"I can explain how muscles get ATP, how signals change strength, and how fiber types differ.","scenarios":[{"title":"A cyclist rides as hard as possible","intro":["A cyclist rides as hard as possible. A lab measures which energy source makes the new ATP at four times.","Creatine phosphate stores energy ready to make ATP fast. Glycolysis breaks down glucose without oxygen. Aerobic respiration uses oxygen."],"table":{"head":["Time","Creatine phosphate","Glycolysis","Aerobic respiration"],"rows":[["5 seconds","75%","20%","5%"],["30 seconds","10%","60%","30%"],["2 minutes","0%","30%","70%"],["20 minutes","0%","5%","95%"]]},"q":"How does the main source of ATP change as the ride goes on?","claim":[{"t":"It shifts from creatine phosphate to glycolysis to aerobic respiration.","ok":true,"why":"Each source leads at a later time.","s":false},{"t":"Aerobic respiration makes most of the ATP at every time.","ok":false,"why":"At 5 and 30 seconds, other sources lead.","s":false},{"t":"Creatine phosphate makes most of the ATP for the whole ride.","ok":false,"why":"It falls to 0% by 2 minutes.","s":false}],"ev":[{"t":"At 5 seconds, creatine phosphate makes 75% of the ATP.","ok":true,"why":"Creatine phosphate leads at the start.","s":false},{"t":"At 30 seconds, glycolysis makes 60% of the ATP.","ok":true,"why":"Glycolysis leads next.","s":false},{"t":"At 20 minutes, aerobic respiration makes 95% of the ATP.","ok":true,"why":"Aerobic respiration leads late in the ride.","s":false},{"t":"The cyclist rides as hard as possible.","ok":false,"why":"This describes the task. It is not a data point about ATP.","s":false},{"t":"The cyclist breathes faster over time.","ok":false,"why":"This is not in the data, so it cannot be used as evidence.","s":false},{"t":"At 2 minutes, aerobic respiration makes 70% of the ATP.","ok":true,"why":"This shows aerobic respiration taking over from glycolysis.","s":true},{"t":"The ride lasts 20 minutes.","ok":false,"why":"The length of the ride is not a result.","s":true}],"re":[{"t":"Creatine phosphate is fast but runs out in about 10 to 15 seconds. Glycolysis is quick but wastes build up. Aerobic respiration starts slower but can last a long time.","ok":true,"why":"This explains each source's speed and limit.","s":false},{"t":"The muscle switches sources because the nerve signal changes.","ok":false,"why":"The switch depends on supply and speed, not the nerve signal.","s":false},{"t":"Aerobic respiration is the fastest, so it supplies the first seconds.","ok":false,"why":"Creatine phosphate is the fastest. Aerobic respiration starts slower.","s":false},{"t":"Glycolysis uses oxygen, so it can last for hours.","ok":false,"why":"Glycolysis does not use oxygen, and wastes build up.","s":true}],"pr":{"q":"A weightlifter lifts a heavy bar for 6 seconds. Which source makes most of the ATP?","opts":[{"t":"Creatine phosphate","ok":true,"why":"It supplies ATP fastest in the first 10 to 15 seconds.","s":false},{"t":"Glycolysis","ok":false,"why":"Glycolysis leads later, after creatine phosphate runs low.","s":false},{"t":"Aerobic respiration","ok":false,"why":"Aerobic respiration is too slow to lead in the first seconds.","s":false}]},"hint":{"c":"Find which column has the largest percent at each time.","r":"A good reason names how fast each source is and how long it lasts."}},{"title":"Two signals, one after the other","intro":["A scientist sends two nerve signals to a muscle fiber, one right after the other. The scientist records the peak tension after the second signal.","A twitch is one quick contraction and relaxation. A millisecond (ms) is one thousandth of a second."],"table":{"head":["Trial","Time between signals","Peak after first signal","Peak after second signal","Fiber fully relaxed before second signal?"],"rows":[["A","200 ms","10","10","Yes"],["B","20 ms","10","16","No"]]},"q":"Why is the second peak higher in Trial B?","claim":[{"t":"Summation. The second signal arrived before the fiber relaxed, so the twitches added up.","ok":true,"why":"The fiber had not relaxed, and the peak rose.","s":false},{"t":"The second signal was stronger in Trial B.","ok":false,"why":"Nothing in the data says the signals differ.","s":false},{"t":"Recruitment. More motor units turned on in Trial B.","ok":false,"why":"Only one fiber was tested. Recruitment needs more than one motor unit.","s":false}],"ev":[{"t":"In Trial B the signals were 20 ms apart, and the fiber had not relaxed.","ok":true,"why":"A new signal arrived while tension remained.","s":false},{"t":"In Trial B the second peak was 16 and the first was 10.","ok":true,"why":"The peak rose when the signals were close.","s":false},{"t":"In Trial A the second peak was 10, the same as the first.","ok":true,"why":"With full relaxation, the twitches did not add.","s":false},{"t":"Both trials used the same fiber.","ok":false,"why":"This makes the test fair, but it does not show why the peak is higher.","s":false},{"t":"Trial A took longer than Trial B.","ok":false,"why":"Total time does not explain the higher peak.","s":false},{"t":"Trial A has the lowest total tension.","ok":false,"why":"This is not a measurement in the table.","s":true}],"re":[{"t":"A twitch has a contraction phase and a relaxation phase. If a new signal comes before relaxation ends, the new twitch starts on top of leftover tension. The peak is higher.","ok":true,"why":"This explains why timing matters.","s":false},{"t":"Each signal makes the fiber pull harder every time, no matter the timing.","ok":false,"why":"Trial A shows no increase when the fiber relaxed.","s":false},{"t":"The fiber relaxed fully in Trial B, so the tension stacked up.","ok":false,"why":"The table says it did not relax fully in Trial B.","s":false},{"t":"The first twitch warmed up the fiber, so the second twitch was higher.","ok":false,"why":"Trial A also had a first twitch, and its second peak was not higher.","s":true}],"pr":{"q":"Signals now arrive every 5 ms, again and again. What would you expect?","opts":[{"t":"The twitches blend into one smooth, strong pull. This is tetanus.","ok":true,"why":"The fiber never relaxes between signals, so tension stays high.","s":false},{"t":"Each twitch stays separate and equal, as in Trial A.","ok":false,"why":"Trial A had long gaps. A 5 ms gap is much shorter.","s":false},{"t":"The fiber makes no tension, because the signals come too fast.","ok":false,"why":"Fast signals make strong tension, not none.","s":false}]},"hint":{"c":"Compare the last column in Trial A and Trial B.","r":"Say what happens to the fiber between signals."}},{"title":"Two thigh muscle samples","intro":["Two athletes give small samples from the thigh muscle. A lab counts the fiber types and runs a fatigue test.","One athlete is a sprinter. The other is a marathon runner. The sprinter is not named.","Fast-twitch fibers contract quickly. Slow-twitch fibers contract slowly. Mitochondria are the parts of a cell that make ATP using oxygen."],"table":{"head":["Measurement","Athlete X","Athlete Y"],"rows":[["Fast-twitch fibers","78%","25%"],["Slow-twitch fibers","22%","75%"],["Mitochondria per fiber","Few","Many"],["Time until force drops by half in a hard test","30 seconds","12 minutes"]]},"q":"Which athlete is the sprinter?","claim":[{"t":"Athlete X is the sprinter.","ok":true,"why":"X has mostly fast-twitch fibers and tires quickly.","s":false},{"t":"Athlete Y is the sprinter.","ok":false,"why":"Y has mostly slow-twitch fibers and resists fatigue.","s":false},{"t":"The data cannot show which athlete is the sprinter.","ok":false,"why":"The fiber types and the fatigue time both point to X.","s":false}],"ev":[{"t":"Athlete X has 78% fast-twitch fibers.","ok":true,"why":"Sprints need fast, powerful fibers.","s":false},{"t":"Athlete X has few mitochondria per fiber.","ok":true,"why":"Few mitochondria means less aerobic ATP, so X tires quickly.","s":false},{"t":"Athlete X's force dropped by half in 30 seconds.","ok":true,"why":"A fast drop in force fits a sprinter.","s":false},{"t":"Both athletes gave samples from the thigh.","ok":false,"why":"This is true, but it does not separate the athletes.","s":false},{"t":"Both athletes gave samples to a lab.","ok":false,"why":"This does not separate the athletes.","s":false},{"t":"Athlete Y has 75% slow-twitch fibers.","ok":true,"why":"This rules out Y as the sprinter.","s":true}],"re":[{"t":"Fast-twitch fibers contract quickly and strongly but tire fast. They have few mitochondria and rely on glycolysis. A sprint needs short, strong effort.","ok":true,"why":"This connects fiber traits to the event.","s":false},{"t":"Fast-twitch fibers resist fatigue because they use aerobic respiration.","ok":false,"why":"Slow-twitch fibers do that.","s":false},{"t":"The athlete with more mitochondria is the sprinter, because mitochondria make power fast.","ok":false,"why":"Mitochondria support long-lasting aerobic ATP, which fits endurance.","s":false},{"t":"Slow-twitch fibers have less myoglobin, so they tire quickly.","ok":false,"why":"Slow-twitch fibers have more myoglobin, which stores oxygen.","s":true}],"pr":{"q":"A weightlifter lifts a very heavy weight one time. Which fiber type does most of the work?","opts":[{"t":"Fast-twitch fibers","ok":true,"why":"A single powerful lift uses fast-twitch fibers.","s":false},{"t":"Slow-twitch fibers","ok":false,"why":"Slow-twitch fibers make less force and are used for long, steady work.","s":false},{"t":"Neither, because the lift uses no fibers.","ok":false,"why":"Every lift uses muscle fibers.","s":false}]},"hint":{"c":"Which athlete's force dropped by half faster?","r":"Link fiber type to how fast the fibers contract and how fast they tire."}}]}};

<script>
/* CER practice engine, Unit 2.4 Muscular System (Anatomy and Physiology).
   Nothing is saved or sent anywhere. Everything stays on the student's screen.
   Page sets window.CER_LT (1-4). The link sets ?level=support or ?level=stretch. */
(function () {
  var lt = (window.CER_DATA || {})[window.CER_LT];
  var params = new URLSearchParams(location.search);
  var stretch = true;
  var root = document.getElementById("app");
  var S = lt.scenarios;
  var idx = 0, step = "claim";
  var st = {};            // per-scenario working state
  var results = [];       // per-scenario summary text and first-try flags
  var firstTry = { claim: 0, evidence: 0, reasoning: 0, predict: 0 };

  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    for (var k in (attrs || {})) {
      if (k === "text") e.textContent = attrs[k];
      else if (k === "class") e.className = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { e.appendChild(c); });
    return e;
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pick(list) { return list.filter(function (o) { return !o.s || stretch; }); }

  function begin() {
    var sc = S[idx];
    st = {
      sc: sc,
      claim: shuffle(pick(sc.claim)), ev: shuffle(pick(sc.ev)),
      re: shuffle(pick(sc.re)), pr: sc.pr ? shuffle(sc.pr.opts) : [],
      tried: { claim: 0, evidence: 0, reasoning: 0, predict: 0 },
      chosenClaim: null, chosenEv: [], chosenRe: null, wrongSeen: {}
    };
    step = "claim";
    draw();
  }

  function dots() {
    var d = el("div", { class: "dots", "aria-label": "Scenario progress" });
    S.forEach(function (_, i) {
      d.appendChild(el("span", {
        class: "dot" + (i === idx ? " now" : (i < idx ? " done" : "")),
        text: (i < idx ? "✓ " : "") + "Scenario " + (i + 1)
      }));
    });
    return d;
  }

  function header() {
    var level = stretch ? "Stretch" : "Support";
    var h = el("div", {}, [
      el("div", { class: "course", text: "Anatomy and Physiology · Unit 2.4 Muscular System · " + lt.id }),
      el("h1", { text: lt.id + " " + level + ": " + lt.title }),
      el("p", { class: "muted", text: lt.target })
    ]);
    var how = el("div", { class: "how" }, [
      el("strong", { text: "How this works" }),
      el("ol", {}, [
        el("li", { text: "Choose a claim. A claim is a short answer to the question." }),
        el("li", { text: "Tap the evidence. Evidence is data from the scenario that supports your claim." }),
        el("li", { text: "Choose the reasoning. Reasoning explains why the evidence supports the claim." })
      ]),
      el("span", { class: "muted", text: stretch ? "Stretch: no hints, and one extra question in each scenario." : "Support: each step has a hint." })
    ]);
    h.appendChild(how);
    return h;
  }

  function scenarioView() {
    var sc = st.sc, box = el("section", {});
    box.appendChild(el("h2", { text: "Scenario " + (idx + 1) + ": " + sc.title }));
    sc.intro.forEach(function (p) { box.appendChild(el("p", { text: p })); });
    if (sc.table) {
      var t = el("table", {}, [el("caption", { text: "Practice data, made up for this activity. It is not from a real person or study." })]);
      t.appendChild(el("tr", {}, sc.table.head.map(function (h) { return el("th", { text: h, scope: "col" }); })));
      sc.table.rows.forEach(function (r) {
        t.appendChild(el("tr", {}, r.map(function (c, i) { return el(i === 0 ? "th" : "td", i === 0 ? { text: c, scope: "row" } : { text: c }); })));
      });
      box.appendChild(t);
    }
    box.appendChild(el("p", { class: "q", text: sc.q }));
    return box;
  }

  function hint(text) {
    return stretch ? null : el("div", { class: "hint", text: "Hint: " + text });
  }

  function live() { return document.getElementById("live"); }
  function say(cls, text) {
    var m = live(); m.style.display = "block"; m.className = "msg " + cls; m.textContent = text;
  }

  /* ---------- single-choice step (claim, reasoning, predict) ---------- */
  function choiceStep(key, list, intro, hintText, onRight) {
    var wrap = el("div", {});
    wrap.appendChild(el("p", { class: "q", text: intro }));
    var h = hint(hintText); if (h) wrap.appendChild(h);
    var opts = el("div", { class: "opts" });
    var done = false;
    list.forEach(function (o) {
      var b = el("button", { class: "opt", type: "button" }, [document.createTextNode(o.t)]);
      b.addEventListener("click", function () {
        if (done) return;
        st.tried[key]++;
        var why = el("span", { class: "why", text: (o.ok ? "✔ Yes. " : "✘ Not yet. ") + o.why });
        var old = b.querySelector(".why"); if (old) old.remove();
        b.appendChild(why);
        b.classList.add(o.ok ? "good" : "bad");
        if (o.ok) {
          done = true;
          if (st.tried[key] === 1) firstTry[key]++;
          say("good", "Correct. Read the explanations, then continue.");
          Array.prototype.forEach.call(opts.children, function (x) { x.disabled = true; });
          onRight(o);
        } else {
          b.disabled = true;
          say("bad", "Not yet. Read why, then try another choice.");
        }
      });
      opts.appendChild(b);
    });
    wrap.appendChild(opts);
    return wrap;
  }

  /* ---------- evidence step ---------- */
  function evidenceStep() {
    var wrap = el("div", {});
    wrap.appendChild(el("p", { class: "q", text: "Step 2. Tap every piece of evidence that supports your claim. Then press Check." }));
    var h = hint("Pick only data that helps prove your claim. Some true facts do not help."); if (h) wrap.appendChild(h);
    var need = st.ev.filter(function (o) { return o.ok; }).length;
    var opts = el("div", { class: "opts" }), cards = [];
    st.ev.forEach(function (o) {
      var b = el("button", { class: "card", type: "button", "aria-pressed": "false" }, [document.createTextNode(o.t)]);
      b.addEventListener("click", function () {
        if (b.disabled) return;
        b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true");
        b.classList.remove("good", "bad");
        var w = b.querySelector(".why"); if (w) w.remove();
      });
      cards.push({ o: o, b: b }); opts.appendChild(b);
    });
    wrap.appendChild(opts);
    var check = el("button", { class: "go", type: "button", text: "Check my evidence" });
    check.addEventListener("click", function () {
      st.tried.evidence++;
      var wrong = 0, right = 0;
      cards.forEach(function (c) {
        var on = c.b.getAttribute("aria-pressed") === "true";
        var w = c.b.querySelector(".why"); if (w) w.remove();
        c.b.classList.remove("good", "bad");
        if (on) {
          var ok = c.o.ok;
          c.b.classList.add(ok ? "good" : "bad");
          c.b.appendChild(el("span", { class: "why", text: (ok ? "✔ Supports your claim. " : "✘ Does not support your claim. ") + c.o.why }));
          if (ok) right++; else wrong++;
        }
      });
      var missing = need - right;
      if (wrong === 0 && missing === 0) {
        if (st.tried.evidence === 1) firstTry.evidence++;
        st.chosenEv = cards.filter(function (c) { return c.o.ok; }).map(function (c) { return c.o.t; });
        cards.forEach(function (c) {
          c.b.disabled = true;
          if (!c.o.ok) {
            c.b.appendChild(el("span", { class: "why", text: "✘ Not used. " + c.o.why }));
          }
        });
        check.disabled = true;
        say("good", "Correct. You found all the evidence. Continue to the reasoning.");
        nextBtn("Continue to reasoning", function () { step = "reasoning"; draw(); });
      } else {
        var parts = [];
        if (wrong) parts.push("Remove the " + wrong + " card" + (wrong > 1 ? "s" : "") + " marked with ✘.");
        if (missing > 0) parts.push(stretch ? "You are still missing some evidence." : "You are still missing " + missing + " piece" + (missing > 1 ? "s" : "") + " of evidence.");
        say("bad", "Not yet. " + parts.join(" ") + " Then press Check again.");
      }
    });
    wrap.appendChild(check);
    return wrap;
  }

  function nextBtn(label, fn) {
    var area = document.getElementById("nextarea");
    area.textContent = "";
    var b = el("button", { class: "go", type: "button", text: label });
    b.addEventListener("click", fn);
    area.appendChild(b);
    b.focus();
  }

  function cerBlock() {
    var sc = st.sc;
    var box = el("div", { class: "cer" }, [
      el("h3", { text: "Your claim" }), el("p", { text: st.chosenClaim.t }),
      el("h3", { text: "Your evidence" }),
      el("ul", {}, st.chosenEv.map(function (t) { return el("li", { text: t }); })),
      el("h3", { text: "Your reasoning" }), el("p", { text: st.chosenRe.t })
    ]);
    return box;
  }

  function cerText() {
    return "Claim: " + st.chosenClaim.t + "\nEvidence:\n" +
      st.chosenEv.map(function (t) { return "- " + t; }).join("\n") +
      "\nReasoning: " + st.chosenRe.t;
  }

  function finishScenario() {
    results.push("Scenario " + (idx + 1) + ": " + st.sc.title + "\n" + cerText());
    var main = document.getElementById("stepbox");
    main.textContent = "";
    main.appendChild(el("h2", { text: "Your CER for this scenario" }));
    main.appendChild(cerBlock());
    var last = idx === S.length - 1;
    nextBtn(last ? "Finish" : "Next scenario", function () {
      if (last) summary(); else { idx++; begin(); window.scrollTo(0, 0); }
    });
    say("good", "Scenario complete. Read your CER, then continue.");
  }

  function summary() {
    root.textContent = "";
    root.appendChild(header());
    root.appendChild(el("h2", { text: "Finished: " + lt.id + " " + (stretch ? "Stretch" : "Support") }));
    var total = S.length;
    var lines = [
      "Claim chosen right on the first try: " + firstTry.claim + " of " + total,
      "Evidence right on the first check: " + firstTry.evidence + " of " + total,
      "Reasoning right on the first try: " + firstTry.reasoning + " of " + total
    ];
    if (stretch) lines.push("Extra question right on the first try: " + firstTry.predict + " of " + total);
    root.appendChild(el("ul", {}, lines.map(function (l) { return el("li", { text: l }); })));
    root.appendChild(el("p", { class: "muted", text: "This page does not save your work or send it anywhere. Copy your CERs and paste them where your teacher asks." }));
    var all = lt.id + " " + (stretch ? "Stretch" : "Support") + ": " + lt.title + "\n\n" + results.join("\n\n");
    var area = el("textarea", { class: "fallback", readonly: "readonly", "aria-label": "All your CERs" });
    area.value = all;
    var copy = el("button", { class: "go", type: "button", text: "Copy all my CERs" });
    var note = el("p", { role: "status", class: "muted" });
    copy.addEventListener("click", function () {
      function fallback() { area.select(); try { document.execCommand("copy"); note.textContent = "Copied."; } catch (e) { note.textContent = "Select the text below and copy it."; } }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(all).then(function () { note.textContent = "Copied."; }, fallback);
      } else fallback();
    });
    root.appendChild(copy); root.appendChild(note); root.appendChild(area);
    window.scrollTo(0, 0);
  }

  function draw() {
    root.textContent = "";
    root.appendChild(header());
    root.appendChild(dots());
    root.appendChild(scenarioView());
    var box = el("div", { id: "stepbox" });
    var sc = st.sc;
    if (step === "claim") {
      box.appendChild(choiceStep("claim", st.claim, "Step 1. Choose your claim.", sc.hint.c, function (o) {
        st.chosenClaim = o;
        nextBtn("Continue to evidence", function () { step = "evidence"; draw(); });
      }));
    } else {
      var c = el("div", { class: "cer" }, [el("h3", { text: "Your claim" }), el("p", { text: st.chosenClaim.t })]);
      box.appendChild(c);
      if (step === "evidence") {
        box.appendChild(evidenceStep());
      } else if (step === "reasoning") {
        box.appendChild(choiceStep("reasoning", st.re, "Step 3. Choose the reasoning that links your evidence to your claim.", sc.hint.r, function (o) {
          st.chosenRe = o;
          if (stretch && sc.pr) nextBtn("Continue to the extra question", function () { step = "predict"; draw(); });
          else nextBtn("See my CER", function () { finishScenario(); });
        }));
      } else if (step === "predict") {
        box.appendChild(choiceStep("predict", st.pr, "Extra question. " + sc.pr.q, "", function () {
          nextBtn("See my CER", function () { finishScenario(); });
        }));
      }
    }
    root.appendChild(box);
    root.appendChild(el("div", { id: "live", class: "msg", role: "status", "aria-live": "polite" }));
    root.appendChild(el("div", { id: "nextarea" }));
    document.getElementById("live").style.display = "none";
  }

  begin();
})();
</script>
</body>
</html>
